<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="theme-color" content="#080C14"/>
<title>Second Brain</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  background:#080C14;
  color:#E2E8F0;
  font-family:Arial,sans-serif;
}

#wrap{
  max-width:430px;
  margin:auto;
  min-height:100vh;
}

#hdr{
  padding:14px 16px;
  border-bottom:1px solid #1F2937;
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:#080C14;
  position:sticky;
  top:0;
  z-index:10;
}

#appBody{
  padding:16px;
  padding-bottom:120px;
}

#nav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:#111827;
  display:flex;
  justify-content:space-around;
  padding:10px 0 20px;
  border-top:1px solid #1F2937;
  z-index:10;
}

#fab{
  position:fixed;
  bottom:90px;
  right:20px;
  width:54px;
  height:54px;
  border-radius:50%;
  border:none;
  background:linear-gradient(135deg,#4F8EF7,#A78BFA);
  color:white;
  font-size:28px;
  cursor:pointer;
  box-shadow:0 4px 16px #4F8EF755;
  z-index:20;
}

.ntab{
  background:none;
  border:none;
  color:#6B7280;
  cursor:pointer;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:4px;
  font-size:11px;
}

.ntab.on{
  color:#4F8EF7;
}

.ntab span:first-child{
  font-size:20px;
}

.sg{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
  margin:18px 0;
}

.sc{
  background:#111827;
  padding:12px;
  border-radius:12px;
  text-align:center;
}

.sv{
  font-size:20px;
  font-weight:700;
}

.sl{
  font-size:10px;
  color:#6B7280;
  margin-top:4px;
}

.cg{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  margin-top:12px;
}

.ct{
  background:#111827;
  border:none;
  border-radius:14px;
  padding:16px;
  color:white;
  cursor:pointer;
  position:relative;
}

.tc{
  background:#111827;
  border-radius:14px;
  padding:14px;
  margin-bottom:12px;
}

.badge{
  background:#1F2937;
  padding:4px 8px;
  border-radius:6px;
  font-size:10px;
  display:inline-block;
  margin-right:4px;
  margin-top:6px;
}

.chips{
  display:flex;
  gap:6px;
  overflow-x:auto;
  padding-bottom:10px;
  margin-bottom:8px;
}

.chipbtn{
  background:#111827;
  border:1px solid #1F2937;
  border-radius:99px;
  color:#6B7280;
  font-size:11px;
  padding:5px 12px;
  cursor:pointer;
  white-space:nowrap;
  flex-shrink:0;
}

.ovl{
  position:fixed;
  inset:0;
  background:#00000090;
  display:flex;
  align-items:flex-end;
  z-index:50;
}

.mdl{
  background:#111827;
  width:100%;
  max-width:430px;
  margin:auto;
  border-radius:20px 20px 0 0;
  padding:20px;
  max-height:88vh;
  overflow-y:auto;
}

.mhdl{
  width:36px;
  height:4px;
  background:#374151;
  border-radius:99px;
  margin:0 auto 16px;
}

.mhd{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:16px;
}

.mttl{
  font-size:18px;
  font-weight:700;
}

.mclb{
  background:none;
  border:none;
  color:#94A3B8;
  font-size:20px;
  cursor:pointer;
}

.inp,.sel,.inpta{
  width:100%;
  background:#080C14;
  border:1px solid #374151;
  border-radius:10px;
  padding:11px 12px;
  color:white;
  font-family:Arial,sans-serif;
  font-size:14px;
  outline:none;
  display:block;
  margin-top:6px;
}

.inpta{
  height:80px;
  resize:none;
}

.svbtn{
  width:100%;
  background:linear-gradient(135deg,#4F8EF7,#A78BFA);
  border:none;
  border-radius:12px;
  padding:14px;
  color:white;
  font-weight:700;
  margin-top:16px;
  cursor:pointer;
  font-size:15px;
}

.fld{
  margin-bottom:14px;
}

.flbl{
  font-size:11px;
  color:#94A3B8;
  text-transform:uppercase;
}

.r2{
  display:flex;
  gap:10px;
  margin-bottom:14px;
}

.r2 > div{
  flex:1;
}

.abar{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
  margin-bottom:16px;
}

.lce{
  background:#111827;
  border-radius:10px;
  padding:10px 12px;
  margin-bottom:6px;
  display:flex;
  gap:8px;
  align-items:flex-start;
}

pre{
  white-space:pre-wrap;
  word-wrap:break-word;
}

button{
  font-family:inherit;
}
</style>
</head>

<body>

<div id="wrap">

  <div id="hdr">
    <div style="font-size:18px;font-weight:700;">
      Second Brain
    </div>

    <div style="display:flex;align-items:center;gap:8px;">
      <div id="stxt" style="font-size:10px;color:#34D399;">Ready</div>

      <button onclick="toggleApi()" style="background:#111827;border:none;border-radius:8px;color:#94A3B8;font-size:12px;padding:6px 10px;cursor:pointer;">
        Key
      </button>
    </div>
  </div>

  <div id="apanel" style="display:none;padding:12px 16px;background:#0D1420;border-bottom:1px solid #1F2937;">

    <div style="font-size:11px;color:#6B7280;margin-bottom:8px;">
      Anthropic API Key
    </div>

    <div style="display:flex;gap:8px;margin-bottom:6px;">

      <input
        type="password"
        id="akey"
        placeholder="sk-ant-..."
        style="flex:1;background:#080C14;border:1px solid #374151;border-radius:10px;padding:10px 12px;color:white;font-size:13px;"
      />

      <button onclick="saveKey()" style="background:#4F8EF7;border:none;border-radius:10px;color:white;padding:0 14px;cursor:pointer;">
        Save
      </button>

      <button onclick="toggleApi()" style="background:#1F2937;border:none;border-radius:10px;color:#94A3B8;padding:0 12px;cursor:pointer;">
        X
      </button>

    </div>

  </div>

  <div id="appBody"></div>

</div>

<div id="nav">

  <button class="ntab on" onclick="setTab('home')">
    <span>🏠</span>
    <span>Home</span>
  </button>

  <button class="ntab" onclick="setTab('work')">
    <span>💼</span>
    <span>Work</span>
  </button>

  <button class="ntab" onclick="setTab('projects')">
    <span>🚀</span>
    <span>Projects</span>
  </button>

  <button class="ntab" onclick="setTab('log')">
    <span>📋</span>
    <span>Log</span>
  </button>

  <button class="ntab" onclick="setTab('report')">
    <span>📊</span>
    <span>Report</span>
  </button>

</div>

<button id="fab" onclick="onFab()">+</button>

<div id="mc"></div>

<script>

var DEFAULT_CATS = [
  {id:'work',label:'Work',color:'#4F8EF7'},
  {id:'projects',label:'Projects',color:'#A78BFA'},
  {id:'personal',label:'Personal',color:'#34D399'},
  {id:'knowledge',label:'Knowledge',color:'#FBBF24'},
  {id:'health',label:'Health',color:'#FB923C'}
];

var PRI = [
  {id:'urgent',label:'Urgent',color:'#F87171'},
  {id:'high',label:'High',color:'#FBBF24'},
  {id:'normal',label:'Normal',color:'#94A3B8'},
  {id:'low',label:'Low',color:'#475569'}
];

var STAT = [
  {id:'todo',label:'To Do',color:'#94A3B8'},
  {id:'inprogress',label:'In Progress',color:'#FBBF24'},
  {id:'done',label:'Done',color:'#34D399'},
  {id:'blocked',label:'Blocked',color:'#F87171'}
];

var tasks = [
  {
    id:'1',
    title:'DHCP Scope Failover UAT',
    category:'work',
    priority:'urgent',
    status:'inprogress',
    dueDate:'2026-05-09',
    notes:'Discuss feasibility with Vikas Maurya'
  },
  {
    id:'2',
    title:'PacketFence Patching',
    category:'work',
    priority:'high',
    status:'inprogress',
    dueDate:'2026-05-25',
    notes:'PFE01 pending'
  },
  {
    id:'3',
    title:'SailPoint Migration',
    category:'projects',
    priority:'urgent',
    status:'inprogress',
    dueDate:'2026-05-11',
    notes:'Replication validation pending'
  }
];

var worklog = [];

var cats = JSON.parse(JSON.stringify(DEFAULT_CATS));

var tab = 'home';
var fStatus = 'all';
var report = '';
var repLoading = false;
var repCopied = false;
var expId = null;

function uid(){
  return Math.random().toString(36).slice(2);
}

function todayStr(){
  return new Date().toISOString().slice(0,10);
}

function toggleApi(){

  var p = document.getElementById('apanel');

  if(p.style.display === 'block'){
    p.style.display = 'none';
  }else{
    p.style.display = 'block';
  }
}

function saveKey(){

  var key = document.getElementById('akey').value.trim();

  localStorage.setItem('sb_key',key);

  document.getElementById('stxt').textContent = 'Key Saved';

  toggleApi();
}

function setTab(t){

  tab = t;

  var tabs = document.querySelectorAll('.ntab');

  tabs.forEach(function(el){
    el.classList.remove('on');
  });

  var arr = ['home','work','projects','log','report'];

  var idx = arr.indexOf(t);

  if(idx >= 0){
    tabs[idx].classList.add('on');
  }

  render();
}

function onFab(){

  if(tab === 'log'){
    showLogModal();
    return;
  }

  showTaskModal();
}

function fdate(iso){

  if(!iso) return '';

  var today = new Date();
  today.setHours(0,0,0,0);

  var dt = new Date(iso);
  dt.setHours(0,0,0,0);

  var diff = Math.round((dt - today)/86400000);

  if(diff === 0) return 'Today';

  if(diff === 1) return 'Tomorrow';

  if(diff < 0) return Math.abs(diff) + 'd ago';

  return new Date(iso).toLocaleDateString(
    'en-US',
    {
      month:'short',
      day:'numeric'
    }
  );
}

function isOverdue(t){

  return (
    t.dueDate &&
    t.status !== 'done' &&
    new Date(t.dueDate) < new Date(new Date().toDateString())
  );
}

function getC(id){

  return cats.find(function(c){
    return c.id === id;
  }) || cats[0];
}

function getP(id){

  return PRI.find(function(p){
    return p.id === id;
  }) || PRI[2];
}

function getS(id){

  return STAT.find(function(s){
    return s.id === id;
  }) || STAT[0];
}

function render(){

  var b = document.getElementById('appBody');

  if(tab === 'home'){
    b.innerHTML = renderHome();
    return;
  }

  if(tab === 'work'){
    b.innerHTML = renderList('work');
    return;
  }

  if(tab === 'projects'){
    b.innerHTML = renderList('projects');
    return;
  }

  if(tab === 'log'){
    b.innerHTML = renderLog();
    return;
  }

  if(tab === 'report'){
    b.innerHTML = renderRep();
    return;
  }
}

function renderHome(){

  var done = tasks.filter(function(t){
    return t.status === 'done';
  }).length;

  var active = tasks.filter(function(t){
    return t.status === 'inprogress';
  }).length;

  var overdue = tasks.filter(isOverdue).length;

  var html = '';

  html += '<h1 style="font-size:26px;font-weight:700;margin-bottom:4px;">Your Second Brain</h1>';

  html += '<p style="font-size:12px;color:#94A3B8;">';

  html += new Date().toLocaleDateString(
    'en-US',
    {
      weekday:'long',
      month:'long',
      day:'numeric'
    }
  );

  html += '</p>';

  html += '<div class="sg">';

  html += '<div class="sc">';
  html += '<div class="sv" style="color:#4F8EF7;">'+tasks.length+'</div>';
  html += '<div class="sl">TOTAL</div>';
  html += '</div>';

  html += '<div class="sc">';
  html += '<div class="sv" style="color:#34D399;">'+done+'</div>';
  html += '<div class="sl">DONE</div>';
  html += '</div>';

  html += '<div class="sc">';
  html += '<div class="sv" style="color:#FBBF24;">'+active+'</div>';
  html += '<div class="sl">ACTIVE</div>';
  html += '</div>';

  html += '<div class="sc">';
  html += '<div class="sv" style="color:#F87171;">'+overdue+'</div>';
  html += '<div class="sl">OVERDUE</div>';
  html += '</div>';

  html += '</div>';

  html += '<div style="font-size:11px;color:#6B7280;margin-bottom:12px;text-transform:uppercase;">Categories</div>';

  html += '<div class="cg">';

  cats.forEach(function(c){

    var cnt = tasks.filter(function(t){
      return t.category === c.id && t.status !== 'done';
    }).length;

    html += '<button class="ct" onclick="setTab(\''+c.id+'\')">';

    html += '<div style="font-size:14px;font-weight:700;">'+c.label+'</div>';

    html += '<div style="font-size:11px;color:#6B7280;margin-top:6px;">'+cnt+' open</div>';

    html += '</button>';

  });

  html += '</div>';

  return html;
}

function renderList(cat){

  var c = getC(cat);

  var list = tasks.filter(function(t){
    return t.category === cat;
  });

  var html = '';

  html += '<h2 style="font-size:22px;font-weight:700;margin-bottom:16px;">'+c.label+'</h2>';

  if(!list.length){

    html += '<p style="color:#6B7280;text-align:center;padding:40px 0;">No tasks</p>';

    return html;
  }

  list.forEach(function(t){

    var p = getP(t.priority);
    var s = getS(t.status);
    var ov = isOverdue(t);

    html += '<div class="tc">';

    html += '<div style="font-size:15px;font-weight:700;">'+t.title+'</div>';

    html += '<div style="font-size:12px;color:#94A3B8;margin-top:8px;">'+t.notes+'</div>';

    html += '<div style="margin-top:8px;">';

    html += '<span class="badge" style="color:'+p.color+';">'+p.label+'</span>';

    html += '<span class="badge" style="color:'+s.color+';">'+s.label+'</span>';

    html += '<span class="badge" style="color:'+(ov ? '#F87171' : '#6B7280')+';">'+fdate(t.dueDate)+'</span>';

    html += '</div>';

    html += '<div style="display:flex;gap:8px;margin-top:12px;">';

    html += '<button onclick="cycleStatus(\''+t.id+'\')" style="flex:1;background:#1F2937;border:none;border-radius:8px;color:#94A3B8;padding:10px;cursor:pointer;">Next Status</button>';

    html += '<button onclick="deleteTask(\''+t.id+'\')" style="background:#F8717120;border:1px solid #F87171;border-radius:8px;color:#F87171;padding:10px 12px;cursor:pointer;">Delete</button>';

    html += '</div>';

    html += '</div>';

  });

  return html;
}

function renderLog(){

  var html = '';

  html += '<h2 style="font-size:22px;font-weight:700;margin-bottom:16px;">Worklog</h2>';

  if(!worklog.length){

    html += '<p style="color:#6B7280;text-align:center;padding:40px 0;">No entries</p>';

    return html;
  }

  worklog.forEach(function(e){

    html += '<div class="lce">';

    html += '<div style="flex:1;">';

    html += '<div style="font-size:12px;color:#C8D6E5;">'+e.text+'</div>';

    html += '<div style="font-size:10px;color:#6B7280;margin-top:4px;">'+e.date+'</div>';

    html += '</div>';

    html += '</div>';

  });

  return html;
}

function renderRep(){

  var html = '';

  html += '<h2 style="font-size:22px;font-weight:700;margin-bottom:16px;">Weekly Report</h2>';

  html += '<button onclick="buildReport()" style="width:100%;padding:14px;background:linear-gradient(135deg,#4F8EF7,#A78BFA);border:none;border-radius:12px;color:white;font-weight:700;cursor:pointer;">';

  html += repLoading ? 'Generating...' : 'Generate Weekly Report';

  html += '</button>';

  if(report){

    html += '<div style="margin-top:16px;background:#111827;border-radius:12px;padding:14px;">';

    html += '<pre>'+escapeHtml(report)+'</pre>';

    html += '</div>';
  }

  return html;
}

function escapeHtml(str){

  return str
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;');
}

function cycleStatus(id){

  var order = ['todo','inprogress','done','blocked'];

  tasks = tasks.map(function(t){

    if(t.id !== id){
      return t;
    }

    var idx = order.indexOf(t.status);

    return Object.assign({},t,{
      status:order[(idx + 1) % order.length]
    });

  });

  render();
}

function deleteTask(id){

  if(!confirm('Delete task?')){
    return;
  }

  tasks = tasks.filter(function(t){
    return t.id !== id;
  });

  render();
}

function buildReport(){

  repLoading = true;

  render();

  setTimeout(function(){

    report =
`Hi Sir,

Please find below my weekly work update:

- DHCP Scope Failover UAT ongoing
- PacketFence patching in progress
- SailPoint migration activities progressing

Thanks,
Abhi Kapoor`;

    repLoading = false;

    render();

  },1000);
}

function showTaskModal(){

  document.getElementById('mc').innerHTML =

  '<div class="ovl" onclick="if(event.target===this)closeModal()">' +

    '<div class="mdl">' +

      '<div class="mhdl"></div>' +

      '<div class="mhd">' +

        '<span class="mttl">New Task</span>' +

        '<button class="mclb" onclick="closeModal()">X</button>' +

      '</div>' +

      '<div class="fld">' +
        '<div class="flbl">Title</div>' +
        '<input class="inp" id="newTitle" placeholder="Task title" />' +
      '</div>' +

      '<div class="fld">' +
        '<div class="flbl">Notes</div>' +
        '<textarea class="inpta" id="newNotes"></textarea>' +
      '</div>' +

      '<button class="svbtn" onclick="saveTask()">Add Task</button>' +

    '</div>' +

  '</div>';
}

function saveTask(){

  var title = document.getElementById('newTitle').value.trim();

  if(!title){
    alert('Title required');
    return;
  }

  tasks.unshift({
    id:uid(),
    title:title,
    notes:document.getElementById('newNotes').value,
    category:'work',
    priority:'normal',
    status:'todo',
    dueDate:'',
  });

  closeModal();

  render();
}

function showLogModal(){

  document.getElementById('mc').innerHTML =

  '<div class="ovl" onclick="if(event.target===this)closeModal()">' +

    '<div class="mdl">' +

      '<div class="mhdl"></div>' +

      '<div class="mhd">' +

        '<span class="mttl">Log Entry</span>' +

        '<button class="mclb" onclick="closeModal()">X</button>' +

      '</div>' +

      '<div class="fld">' +
        '<textarea class="inpta" id="logText" placeholder="What did you work on?"></textarea>' +
      '</div>' +

      '<button class="svbtn" onclick="saveLog()">Save Entry</button>' +

    '</div>' +

  '</div>';
}

function saveLog(){

  var text = document.getElementById('logText').value.trim();

  if(!text){
    alert('Enter worklog');
    return;
  }

  worklog.unshift({
    id:uid(),
    text:text,
    date:todayStr()
  });

  closeModal();

  render();
}

function closeModal(){

  document.getElementById('mc').innerHTML = '';
}

render();

document.getElementById('stxt').textContent =
  tasks.length + ' tasks loaded';

</script>

</body>
</html>
