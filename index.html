// ── UTILS ─────────────────────────────────────────────────────────────────────
function uid()    { return Math.random().toString(36).slice(2)+Date.now().toString(36); }
function nowISO() { return new Date().toISOString(); }
function todayStr(){ return new Date().toISOString().slice(0,10); }

function fdate(iso) {
  if(!iso) return '';
  var today=new Date(); today.setHours(0,0,0,0);
  var dt=new Date(iso); dt.setHours(0,0,0,0);
  var d=Math.round((dt-today)/86400000);
  if(d===0) return 'Today'; if(d===1) return 'Tomorrow';
  if(d<0) return Math.abs(d)+'d ago';
  if(d<8) return new Date(iso).toLocaleDateString('en-US',{weekday:'short'});
  return new Date(iso).toLocaleDateString('en-US',{month:'short',day:'numeric'});
}

function isOv(t) { return t.dueDate&&t.status!=='done'&&new Date(t.dueDate)<new Date(new Date().toDateString()); }

function weekRange() {
  var d=new Date(),day=d.getDay();
  var mon=new Date(d); mon.setDate(d.getDate()-((day+6)%7));
  var sun=new Date(mon); sun.setDate(mon.getDate()+6);
  function fmt(x){ return x.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}); }
  return {start:mon.toISOString().slice(0,10),end:sun.toISOString().slice(0,10),label:fmt(mon)+' - '+fmt(sun)};
}

// ── DRIVE ─────────────────────────────────────────────────────────────────────
async function callAI(sys,usr,mx,useMCP) {
  var body={model:MODEL,max_tokens:mx||1000,system:sys,messages:[{role:'user',content:usr}]};
  if(useMCP) body.mcp_servers=[{type:'url',url:DMCP,name:'gdrive'}];
  var r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json','x-api-key':apiKey,'anthropic-version':'2023-06-01','anthropic-beta':'mcp-client-2025-04-04'},body:JSON.stringify(body)});
  return r.json();
}
async function driveRead(fid) {
  if(!apiKey) return null;
  try{
    var d=await callAI('You have Google Drive access. Read file ID "'+fid+'". Return ONLY raw JSON.','Read file.',4000,true);
    var bl=d.content||[];
    for(var i=0;i<bl.length;i++){if(bl[i].type==='mcp_tool_result'){var t=(bl[i].content&&bl[i].content[0]&&bl[i].content[0].text)||'';try{return JSON.parse(t);}catch(e){}}}
    for(var j=0;j<bl.length;j++){if(bl[j].type==='text'){var m=bl[j].text.match(/\{[\s\S]*\}/);if(m){try{return JSON.parse(m[0]);}catch(e){}}}}
  }catch(e){}
  return null;
}
async function driveWrite(fid,obj) {
  if(!apiKey) return;
  try{obj.lastUpdated=nowISO();await callAI('You have Google Drive access. Overwrite file ID "'+fid+'" with exact JSON. Reply: saved','Save:\n'+JSON.stringify(obj,null,2),200,true);}catch(e){}
}
function debSave(key,fid,data) {
  clearTimeout(saveTimers[key]);
  saveTimers[key]=setTimeout(async function(){setSyncDot('#FBBF24','Saving...');await driveWrite(fid,data);setSyncDot('#34D399','Saved');},1200);
}
function saveTasks() { lsave(); debSave('t',DRIVE.tasks,{version:1,items:tasks}); }
function saveWL()    { lsave(); debSave('w',DRIVE.worklog,{version:1,entries:worklog}); }
async function syncDrive() {
  setSyncDot('#FBBF24','Syncing...');
  try{
    var res=await Promise.all([driveRead(DRIVE.tasks),driveRead(DRIVE.worklog),driveRead(DRIVE.categories)]);
    if(res[0]&&res[0].items&&res[0].items.length) tasks=res[0].items;

    if(res[2]&&res[2].categories&&res[2].categories.length) cats=res[2].categories;
    lsave(); setSyncDot('#34D399','Synced');
  }catch(e){setSyncDot('#F87171','Sync failed');}
  render();
}
