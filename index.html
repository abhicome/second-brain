<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="theme-color" content="#080C14"/>
<title>Second Brain</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  background:#080C14;
  color:#E2E8F0;
  font-family:Arial,sans-serif;
}

#wrap{
  max-width:430px;
  margin:auto;
  min-height:100vh;
}

#hdr{
  padding:14px 16px;
  border-bottom:1px solid #1F2937;
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:#080C14;
  position:sticky;
  top:0;
  z-index:10;
}

#appBody{
  padding:16px;
  padding-bottom:120px;
}

#nav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:#111827;
  display:flex;
  justify-content:space-around;
  padding:10px 0 20px;
  border-top:1px solid #1F2937;
  z-index:20;
}

.ntab{
  background:none;
  border:none;
  color:#6B7280;
  cursor:pointer;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:4px;
  font-size:11px;
}

.ntab.on{
  color:#4F8EF7;
}

.ntab span:first-child{
  font-size:20px;
}

.sg{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
  margin:18px 0;
}

.sc{
  background:#111827;
  padding:12px;
  border-radius:12px;
  text-align:center;
}

.sv{
  font-size:20px;
  font-weight:700;
}

.sl{
  font-size:10px;
  color:#6B7280;
  margin-top:4px;
}

.cg{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  margin-top:12px;
}

.ct{
  background:#111827;
  border:none;
  border-radius:14px;
  padding:16px;
  color:white;
  cursor:pointer;
  text-align:left;
}

.tc{
  background:#111827;
  border-radius:14px;
  padding:14px;
  margin-bottom:12px;
}

.badge{
  background:#1F2937;
  padding:4px 8px;
  border-radius:6px;
  font-size:10px;
  display:inline-block;
  margin-right:4px;
  margin-top:6px;
}

.fab{
  position:fixed;
  right:18px;
  bottom:90px;
  width:58px;
  height:58px;
  border:none;
  border-radius:50%;
  background:linear-gradient(135deg,#4F8EF7,#A78BFA);
  color:white;
  font-size:30px;
  box-shadow:0 8px 24px rgba(79,142,247,.4);
  z-index:50;
}

pre{
  white-space:pre-wrap;
  line-height:1.7;
  font-size:11px;
  color:#C8D6E5;
}

</style>
</head>

<body>

<div id="wrap">

  <div id="hdr">

    <div style="font-size:18px;font-weight:700;">
      Second Brain
    </div>

    <div style="display:flex;gap:8px;align-items:center;">

      <button onclick="testDrive()" style="background:#111827;border:none;color:#94A3B8;padding:6px 10px;border-radius:8px;cursor:pointer;">
        Test
      </button>

      <div id="stxt" style="font-size:10px;color:#34D399;">
        Ready
      </div>

    </div>

  </div>

  <div id="appBody"></div>

</div>

<div id="nav">

  <button class="ntab on" onclick="setTab('home')">
    <span>🏠</span>
    <span>Home</span>
  </button>

  <button class="ntab" onclick="setTab('work')">
    <span>💼</span>
    <span>Work</span>
  </button>

  <button class="ntab" onclick="setTab('projects')">
    <span>🚀</span>
    <span>Projects</span>
  </button>

  <button class="ntab" onclick="setTab('log')">
    <span>📋</span>
    <span>Log</span>
  </button>

  <button class="ntab" onclick="setTab('report')">
    <span>📊</span>
    <span>Report</span>
  </button>

</div>

<button class="fab">
  +
</button>

<script>

var TASK_FILE_ID = '1OWIXMe5PvrXOZXDVFDxVfylXQ8Kml_IE';

var API_KEY = localStorage.getItem('sb_api') || '';

var tab = 'home';

var tasks = [
{
  id:'1',
  title:'DHCP Scope Failover UAT',
  category:'work',
  priority:'urgent',
  status:'inprogress',
  dueDate:'2026-05-09',
  notes:'Discuss with Vikas Maurya'
},
{
  id:'2',
  title:'PacketFence Patching',
  category:'work',
  priority:'high',
  status:'inprogress',
  dueDate:'2026-05-25',
  notes:'PFE01 pending'
},
{
  id:'3',
  title:'AD Transformation Roadmap',
  category:'projects',
  priority:'high',
  status:'inprogress',
  dueDate:'2026-05-08',
  notes:'Awaiting Microsoft response'
},
{
  id:'4',
  title:'Arista AGNI Implementation',
  category:'projects',
  priority:'high',
  status:'inprogress',
  dueDate:'2026-09-30',
  notes:'Infosec approval pending'
}
];

var worklog = [
{
  id:'1',
  date:'2026-05-05',
  text:'AD transformation discussion with Microsoft'
},
{
  id:'2',
  date:'2026-05-04',
  text:'DHCP incident RCA'
}
];

function setTab(t){

  tab = t;

  var tabs = document.querySelectorAll('.ntab');

  for(var i=0;i<tabs.length;i++){
    tabs[i].classList.remove('on');
  }

  var arr = ['home','work','projects','log','report'];

  tabs[arr.indexOf(t)].classList.add('on');

  render();
}

function fdate(iso){

  if(!iso) return '';

  var today = new Date();
  today.setHours(0,0,0,0);

  var dt = new Date(iso);
  dt.setHours(0,0,0,0);

  var diff = Math.round((dt-today)/86400000);

  if(diff===0) return 'Today';

  if(diff===1) return 'Tomorrow';

  if(diff<0) return Math.abs(diff)+'d ago';

  return new Date(iso).toLocaleDateString('en-US',{
    month:'short',
    day:'numeric'
  });
}

function isOverdue(t){

  return (
    t.dueDate &&
    t.status !== 'done' &&
    new Date(t.dueDate) < new Date(new Date().toDateString())
  );
}

function render(){

  var b = document.getElementById('appBody');

  if(tab==='home'){
    b.innerHTML = renderHome();
    return;
  }

  if(tab==='work'){
    b.innerHTML = renderList('work');
    return;
  }

  if(tab==='projects'){
    b.innerHTML = renderList('projects');
    return;
  }

  if(tab==='log'){
    b.innerHTML = renderLog();
    return;
  }

  if(tab==='report'){
    b.innerHTML = renderReport();
    return;
  }
}

function renderHome(){

  var done = tasks.filter(function(t){
    return t.status==='done';
  }).length;

  var overdue = tasks.filter(isOverdue).length;

  var html = '';

  html += '<h1 style="font-size:26px;font-weight:700;margin-bottom:4px;">';
  html += 'Your Second Brain';
  html += '</h1>';

  html += '<p style="font-size:12px;color:#94A3B8;">';
  html += new Date().toLocaleDateString('en-US',{
    weekday:'long',
    month:'long',
    day:'numeric'
  });
  html += '</p>';

  html += '<div class="sg">';

  html += '<div class="sc">';
  html += '<div class="sv" style="color:#4F8EF7;">'+tasks.length+'</div>';
  html += '<div class="sl">TOTAL</div>';
  html += '</div>';

  html += '<div class="sc">';
  html += '<div class="sv" style="color:#34D399;">'+done+'</div>';
  html += '<div class="sl">DONE</div>';
  html += '</div>';

  html += '<div class="sc">';
  html += '<div class="sv" style="color:#FBBF24;">'+worklog.length+'</div>';
  html += '<div class="sl">LOGS</div>';
  html += '</div>';

  html += '<div class="sc">';
  html += '<div class="sv" style="color:#F87171;">'+overdue+'</div>';
  html += '<div class="sl">OVERDUE</div>';
  html += '</div>';

  html += '</div>';

  html += '<div style="font-size:11px;color:#6B7280;text-transform:uppercase;font-weight:600;margin-bottom:12px;">';
  html += 'Categories';
  html += '</div>';

  html += '<div class="cg">';

  html += '<button class="ct" onclick="setTab(\'work\')">';
  html += '<div style="font-size:14px;font-weight:700;">Work</div>';
  html += '<div style="font-size:11px;color:#6B7280;margin-top:6px;">';
  html += tasks.filter(function(t){return t.category==='work';}).length;
  html += ' tasks</div>';
  html += '</button>';

  html += '<button class="ct" onclick="setTab(\'projects\')">';
  html += '<div style="font-size:14px;font-weight:700;">Projects</div>';
  html += '<div style="font-size:11px;color:#6B7280;margin-top:6px;">';
  html += tasks.filter(function(t){return t.category==='projects';}).length;
  html += ' tasks</div>';
  html += '</button>';

  html += '<button class="ct" onclick="setTab(\'log\')">';
  html += '<div style="font-size:14px;font-weight:700;">Worklog</div>';
  html += '<div style="font-size:11px;color:#6B7280;margin-top:6px;">';
  html += worklog.length;
  html += ' entries</div>';
  html += '</button>';

  html += '</div>';

  return html;
}

function renderList(cat){

  var list = tasks.filter(function(t){
    return t.category===cat;
  });

  var html = '';

  html += '<h2 style="font-size:22px;font-weight:700;margin-bottom:16px;">';
  html += cat==='work' ? 'Work' : 'Projects';
  html += '</h2>';

  for(var i=0;i<list.length;i++){

    var t = list[i];

    html += '<div class="tc">';

    html += '<div style="font-size:15px;font-weight:700;">';
    html += t.title;
    html += '</div>';

    html += '<div style="font-size:12px;color:#94A3B8;margin-top:8px;">';
    html += t.notes;
    html += '</div>';

    html += '<div>';

    html += '<span class="badge">';
    html += t.priority;
    html += '</span>';

    html += '<span class="badge">';
    html += t.status;
    html += '</span>';

    html += '<span class="badge">';
    html += fdate(t.dueDate);
    html += '</span>';

    html += '</div>';

    html += '</div>';
  }

  return html;
}

function renderLog(){

  var html = '';

  html += '<h2 style="font-size:22px;font-weight:700;margin-bottom:16px;">';
  html += 'Worklog';
  html += '</h2>';

  for(var i=0;i<worklog.length;i++){

    var e = worklog[i];

    html += '<div class="tc">';

    html += '<div style="font-size:11px;color:#6B7280;">';
    html += e.date;
    html += '</div>';

    html += '<div style="margin-top:8px;font-size:13px;line-height:1.5;">';
    html += e.text;
    html += '</div>';

    html += '</div>';
  }

  return html;
}

function renderReport(){

  var html = '';

  html += '<h2 style="font-size:22px;font-weight:700;margin-bottom:16px;">';
  html += 'Weekly Report';
  html += '</h2>';

  html += '<div class="tc">';

  html += '<button onclick="generateReport()" style="width:100%;padding:14px;border:none;border-radius:12px;background:linear-gradient(135deg,#4F8EF7,#A78BFA);color:white;font-weight:700;cursor:pointer;">';
  html += 'Generate Weekly Report';
  html += '</button>';

  html += '<div id="reportBox" style="margin-top:18px;"></div>';

  html += '</div>';

  return html;
}

function generateReport(){

  var txt = '';

  txt += 'Hi Sir\\n\\n';
  txt += 'Please find below my weekly work update:\\n\\n';

  txt += 'Projects\\n\\n';

  for(var i=0;i<tasks.length;i++){

    txt += '- ';
    txt += tasks[i].title;
    txt += ' ('+tasks[i].status+')\\n';
  }

  txt += '\\nWorklog\\n\\n';

  for(var j=0;j<worklog.length;j++){

    txt += '- ';
    txt += worklog[j].text;
    txt += '\\n';
  }

  txt += '\\nThanks,\\nAbhi Kapoor';

  document.getElementById('reportBox').innerHTML =
    '<pre>' +
    txt
      .replace(/&/g,'&amp;')
      .replace(/</g,'&lt;')
      .replace(/>/g,'&gt;') +
    '</pre>';
}

async function testDrive(){

  try{

    if(!API_KEY){

      API_KEY = prompt('Enter Anthropic API Key');

      if(!API_KEY) return;

      localStorage.setItem('sb_api', API_KEY);
    }

    document.getElementById('stxt').textContent = 'Reading Drive...';

    var body = {
      model:'claude-sonnet-4-20250514',
      max_tokens:1000,
      system:'You have Google Drive access.',
      messages:[
        {
          role:'user',
          content:'Read Google Drive file ID: '+TASK_FILE_ID+' and return raw JSON only.'
        }
      ],
      mcp_servers:[
        {
          type:'url',
          url:'https://drivemcp.googleapis.com/mcp/v1',
          name:'gdrive'
        }
      ]
    };

    var r = await fetch('https://api.anthropic.com/v1/messages',{

      method:'POST',

      headers:{
        'Content-Type':'application/json',
        'x-api-key':API_KEY,
        'anthropic-version':'2023-06-01',
        'anthropic-beta':'mcp-client-2025-04-04'
      },

      body:JSON.stringify(body)
    });

    var data = await r.json();

    console.log(data);

    alert(JSON.stringify(data,null,2));

    document.getElementById('stxt').textContent = 'Drive Connected';

  }catch(e){

    console.error(e);

    alert(e.message);

    document.getElementById('stxt').textContent = 'Drive Failed';
  }
}

render();

document.getElementById('stxt').textContent =
  tasks.length + ' tasks loaded';

</script>

</body>
</html>
