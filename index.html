<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="theme-color" content="#080C14"/>
<title>Second Brain</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  background:#080C14;
  color:#E2E8F0;
  font-family:Arial,sans-serif;
}

#wrap{
  max-width:430px;
  margin:auto;
  min-height:100vh;
}

#hdr{
  padding:14px 16px;
  border-bottom:1px solid #1F2937;
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:#080C14;
  position:sticky;
  top:0;
  z-index:10;
}

#appBody{
  padding:16px;
  padding-bottom:120px;
}

#nav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:#111827;
  display:flex;
  justify-content:space-around;
  padding:10px 0 20px;
  border-top:1px solid #1F2937;
  z-index:20;
}

.ntab{
  background:none;
  border:none;
  color:#6B7280;
  cursor:pointer;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:4px;
  font-size:11px;
}

.ntab.on{
  color:#4F8EF7;
}

.ntab span:first-child{
  font-size:20px;
}

.sg{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
  margin:18px 0;
}

.sc{
  background:#111827;
  padding:12px;
  border-radius:12px;
  text-align:center;
}

.sv{
  font-size:20px;
  font-weight:700;
}

.sl{
  font-size:10px;
  color:#6B7280;
  margin-top:4px;
}

.cg{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  margin-top:12px;
}

.ct{
  background:#111827;
  border:none;
  border-radius:14px;
  padding:16px;
  color:white;
  cursor:pointer;
  text-align:left;
}

.tc{
  background:#111827;
  border-radius:14px;
  padding:14px;
  margin-bottom:12px;
}

.badge{
  background:#1F2937;
  padding:4px 8px;
  border-radius:6px;
  font-size:10px;
  display:inline-block;
  margin-right:4px;
  margin-top:6px;
}

.fab{
  position:fixed;
  right:18px;
  bottom:90px;
  width:58px;
  height:58px;
  border:none;
  border-radius:50%;
  background:linear-gradient(135deg,#4F8EF7,#A78BFA);
  color:white;
  font-size:30px;
  box-shadow:0 8px 24px rgba(79,142,247,.4);
  z-index:50;
}

pre{
  white-space:pre-wrap;
  line-height:1.7;
  font-size:11px;
  color:#C8D6E5;
}

</style>
</head>

<body>

<div id="wrap">

  <div id="hdr">

    <div style="font-size:18px;font-weight:700;">
      Second Brain
    </div>

    <div style="display:flex;gap:8px;align-items:center;">

      <button onclick="loadDatabase()" style="background:#111827;border:none;color:#94A3B8;padding:6px 10px;border-radius:8px;cursor:pointer;">
        Sync
      </button>

      <div id="stxt" style="font-size:10px;color:#34D399;">
        Ready
      </div>

    </div>

  </div>

  <div id="appBody"></div>

</div>

<div id="nav">

  <button class="ntab on" onclick="setTab('home')">
    <span>🏠</span>
    <span>Home</span>
  </button>

  <button class="ntab" onclick="setTab('work')">
    <span>💼</span>
    <span>Work</span>
  </button>

  <button class="ntab" onclick="setTab('projects')">
    <span>🚀</span>
    <span>Projects</span>
  </button>

  <button class="ntab" onclick="setTab('log')">
    <span>📋</span>
    <span>Log</span>
  </button>

  <button class="ntab" onclick="setTab('report')">
    <span>📊</span>
    <span>Report</span>
  </button>

</div>

<button class="fab" onclick="quickAdd()">
+
</button>

<script>

var TASKS_URL =
'https://drive.google.com/uc?export=download&id=1OWIXMe5PvrXOZXDVFDxVfylXQ8Kml_IE';

var WORKLOG_URL =
'https://drive.google.com/uc?export=download&id=1w6jQLE48kmnSQ3kXn5TDiafhfYe2y4tQ';

var CATEGORIES_URL =
'https://drive.google.com/uc?export=download&id=14zFd-GoGYRGdbjr76ySlRNb-pqZrNSyK';

var tab='home';

var tasks=[];
var worklog=[];
var categories=[];

function saveLocal(){

  localStorage.setItem('sb_tasks',JSON.stringify(tasks));
  localStorage.setItem('sb_worklog',JSON.stringify(worklog));
  localStorage.setItem('sb_categories',JSON.stringify(categories));
}

function loadLocal(){

  try{

    var t=localStorage.getItem('sb_tasks');
    var w=localStorage.getItem('sb_worklog');
    var c=localStorage.getItem('sb_categories');

    if(t) tasks=JSON.parse(t);
    if(w) worklog=JSON.parse(w);
    if(c) categories=JSON.parse(c);

  }catch(e){
    console.log(e);
  }
}

async function loadDatabase(){

  try{

    document.getElementById('stxt').textContent='Syncing...';

    const responses = await Promise.all([
      fetch(TASKS_URL),
      fetch(WORKLOG_URL),
      fetch(CATEGORIES_URL)
    ]);

    const tasksData = await responses[0].json();
    const worklogData = await responses[1].json();
    const categoriesData = await responses[2].json();

    tasks = tasksData.items || [];
    worklog = worklogData.entries || [];
    categories = categoriesData.categories || [];

    saveLocal();

    render();

    document.getElementById('stxt').textContent='Synced';

  }catch(e){

    console.error(e);

    document.getElementById('stxt').textContent='Sync Failed';

    alert('Database load failed');
  }
}

function setTab(t){

  tab=t;

  var tabs=document.querySelectorAll('.ntab');

  for(var i=0;i<tabs.length;i++){
    tabs[i].classList.remove('on');
  }

  var arr=['home','work','projects','log','report'];

  tabs[arr.indexOf(t)].classList.add('on');

  render();
}

function fdate(iso){

  if(!iso) return '';

  var today=new Date();
  today.setHours(0,0,0,0);

  var dt=new Date(iso);
  dt.setHours(0,0,0,0);

  var diff=Math.round((dt-today)/86400000);

  if(diff===0) return 'Today';

  if(diff===1) return 'Tomorrow';

  if(diff<0) return Math.abs(diff)+'d ago';

  return new Date(iso).toLocaleDateString('en-US',{
    month:'short',
    day:'numeric'
  });
}

function isOverdue(t){

  return (
    t.dueDate &&
    t.status!=='done' &&
    new Date(t.dueDate)<new Date(new Date().toDateString())
  );
}

function render(){

  var b=document.getElementById('appBody');

  if(tab==='home'){
    b.innerHTML=renderHome();
    return;
  }

  if(tab==='work'){
    b.innerHTML=renderList('work');
    return;
  }

  if(tab==='projects'){
    b.innerHTML=renderList('projects');
    return;
  }

  if(tab==='log'){
    b.innerHTML=renderLog();
    return;
  }

  if(tab==='report'){
    b.innerHTML=renderReport();
    return;
  }
}

function renderHome(){

  var done=tasks.filter(function(t){
    return t.status==='done';
  }).length;

  var overdue=tasks.filter(isOverdue).length;

  var html='';

  html+='<h1 style="font-size:26px;font-weight:700;margin-bottom:4px;">';
  html+='Your Second Brain';
  html+='</h1>';

  html+='<p style="font-size:12px;color:#94A3B8;">';
  html+=new Date().toLocaleDateString('en-US',{
    weekday:'long',
    month:'long',
    day:'numeric'
  });
  html+='</p>';

  html+='<div class="sg">';

  html+='<div class="sc">';
  html+='<div class="sv" style="color:#4F8EF7;">'+tasks.length+'</div>';
  html+='<div class="sl">TOTAL</div>';
  html+='</div>';

  html+='<div class="sc">';
  html+='<div class="sv" style="color:#34D399;">'+done+'</div>';
  html+='<div class="sl">DONE</div>';
  html+='</div>';

  html+='<div class="sc">';
  html+='<div class="sv" style="color:#FBBF24;">'+worklog.length+'</div>';
  html+='<div class="sl">LOGS</div>';
  html+='</div>';

  html+='<div class="sc">';
  html+='<div class="sv" style="color:#F87171;">'+overdue+'</div>';
  html+='<div class="sl">OVERDUE</div>';
  html+='</div>';

  html+='</div>';

  html+='<div style="font-size:11px;color:#6B7280;text-transform:uppercase;font-weight:600;margin-bottom:12px;">';
  html+='Categories';
  html+='</div>';

  html+='<div class="cg">';

  html+='<button class="ct" onclick="setTab(\'work\')">';
  html+='<div style="font-size:14px;font-weight:700;">Work</div>';
  html+='<div style="font-size:11px;color:#6B7280;margin-top:6px;">';
  html+=tasks.filter(function(t){return t.category==="work";}).length+' tasks';
  html+='</div>';
  html+='</button>';

  html+='<button class="ct" onclick="setTab(\'projects\')">';
  html+='<div style="font-size:14px;font-weight:700;">Projects</div>';
  html+='<div style="font-size:11px;color:#6B7280;margin-top:6px;">';
  html+=tasks.filter(function(t){return t.category==="projects";}).length+' tasks';
  html+='</div>';
  html+='</button>';

  html+='<button class="ct" onclick="setTab(\'log\')">';
  html+='<div style="font-size:14px;font-weight:700;">Worklog</div>';
  html+='<div style="font-size:11px;color:#6B7280;margin-top:6px;">';
  html+=worklog.length+' entries';
  html+='</div>';
  html+='</button>';

  html+='</div>';

  return html;
}

function renderList(cat){

  var list=tasks.filter(function(t){
    return t.category===cat;
  });

  var html='';

  html+='<h2 style="font-size:22px;font-weight:700;margin-bottom:16px;">';

  html+=cat==='work'?'Work':'Projects';

  html+='</h2>';

  for(var i=0;i<list.length;i++){

    var t=list[i];

    html+='<div class="tc">';

    html+='<div style="font-size:15px;font-weight:700;">';
    html+=t.title;
    html+='</div>';

    html+='<div style="font-size:12px;color:#94A3B8;margin-top:8px;">';
    html+=(t.notes||'');
    html+='</div>';

    html+='<div>';

    html+='<span class="badge">'+(t.priority||'normal')+'</span>';
    html+='<span class="badge">'+(t.status||'todo')+'</span>';

    if(t.dueDate){
      html+='<span class="badge">'+fdate(t.dueDate)+'</span>';
    }

    html+='</div>';

    html+='</div>';
  }

  return html;
}

function renderLog(){

  var html='';

  html+='<h2 style="font-size:22px;font-weight:700;margin-bottom:16px;">';
  html+='Worklog';
  html+='</h2>';

  for(var i=0;i<worklog.length;i++){

    var e=worklog[i];

    html+='<div class="tc">';

    html+='<div style="font-size:11px;color:#6B7280;">';
    html+=e.date||'';
    html+='</div>';

    html+='<div style="margin-top:8px;font-size:13px;">';
    html+=e.text||'';
    html+='</div>';

    html+='</div>';
  }

  return html;
}

function renderReport(){

  return `
  <h2 style="font-size:22px;font-weight:700;margin-bottom:16px;">
    Weekly Report
  </h2>

  <div class="tc">
    <div style="font-size:13px;line-height:1.7;color:#C8D6E5;">
      AI weekly reports coming next.
    </div>
  </div>
  `;
}

function quickAdd(){

  var txt=prompt('Quick task');

  if(!txt) return;

  tasks.unshift({
    id:Date.now().toString(),
    title:txt,
    category:'personal',
    priority:'normal',
    status:'todo',
    dueDate:'',
    notes:''
  });

  saveLocal();

  render();
}

loadLocal();

render();

document.getElementById('stxt').textContent=
tasks.length+' local tasks';

loadDatabase();

</script>

</body>
</html>
