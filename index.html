<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="theme-color" content="#080C14"/>
<title>Second Brain</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body,#app{height:100%;background:#080C14;font-family:Sora,sans-serif;color:#E2E8F0;overflow:hidden}
button{font-family:Sora,sans-serif;cursor:pointer}
input,textarea,select{font-family:Sora,sans-serif;color:#E2E8F0;background:#080C14;color-scheme:dark}
#app{display:flex;flex-direction:column;max-width:430px;margin:0 auto;position:relative}
#hdr{display:flex;justify-content:space-between;align-items:center;padding:14px 16px 10px;border-bottom:1px solid #0F1829;flex-shrink:0}
.brand{font-weight:700;font-size:17px}
.sr{display:flex;align-items:center;gap:5px;margin-top:3px}
#sdot{width:6px;height:6px;border-radius:50%;display:inline-block;background:#34D399}
#stxt{font-size:10px;color:#374151}
.hbs{display:flex;gap:6px}
.hb{background:#0F1829;border:none;border-radius:10px;color:#94A3B8;font-size:14px;padding:8px 12px}
#apanel{background:#0A0F1E;border-bottom:1px solid #1F2937;padding:12px 16px;display:none;flex-shrink:0}
#apanel.on{display:block}
#akey{width:100%;background:#080C14;border:1px solid #1F2937;border-radius:10px;padding:10px 12px;color:#E2E8F0;font-size:13px;outline:none;margin-bottom:6px}
.arow{display:flex;gap:8px;margin-bottom:6px}
.arow input{flex:1}
.asave{background:#4F8EF7;border:none;border-radius:10px;color:#fff;font-size:13px;padding:0 14px;font-weight:600}
.acanc{background:#0F1829;border:none;border-radius:10px;color:#6B7280;font-size:13px;padding:0 12px}
#body{flex:1;overflow-y:auto;padding-bottom:88px;height:0}
.pg{padding:0 16px 16px}
.hero{padding:18px 0 14px;border-bottom:1px solid #0F1829;margin-bottom:16px}
.hdate{font-size:10px;color:#374151;text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px}
.htitle{font-size:24px;font-weight:700;letter-spacing:-0.03em;margin-bottom:3px}
.hsub{font-size:12px;color:#4B5563;margin-bottom:10px}
.bt{height:3px;background:#0F1829;border-radius:99px}
.bf{height:100%;border-radius:99px;background:linear-gradient(90deg,#4F8EF7,#A78BFA);transition:width .5s}
.sg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px}
.sc{background:#0A0F1E;border:1px solid #0F1829;border-radius:12px;padding:10px 6px;text-align:center}
.sv{font-size:20px;font-weight:700;line-height:1}
.sl{font-size:9px;color:#374151;margin-top:3px;text-transform:uppercase;letter-spacing:.06em}
.al{background:#F8717112;border:1px solid #F8717133;border-radius:12px;padding:10px 14px;display:flex;align-items:center;gap:8px;margin-bottom:14px}
.ab{background:#F87171;border:none;border-radius:8px;color:#fff;font-size:12px;font-weight:600;padding:4px 10px}
.stl{color:#374151;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.1em;margin-bottom:8px;margin-top:14px;display:block}
.mc2{display:flex;align-items:center;gap:8px;background:#0A0F1E;border:1px solid #0F1829;border-radius:10px;padding:9px 12px;margin-bottom:6px;cursor:pointer}
.ma{width:3px;height:24px;border-radius:99px;flex-shrink:0}
.wb{background:linear-gradient(135deg,#4F8EF715,#A78BFA15);border:1px solid #4F8EF733;border-radius:14px;padding:14px 16px;margin:14px 0;display:flex;align-items:center;justify-content:space-between}
.wl{font-size:13px;font-weight:600}
.ws{color:#4B5563;font-size:11px;margin-top:2px}
.wbtn{background:transparent;border:none;color:#4F8EF7;font-size:12px;font-weight:600;padding:0}
.cg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
.ct{background:#0A0F1E;border:1px solid #0F1829;border-radius:14px;padding:14px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;position:relative;outline:none}
.cba{position:absolute;top:6px;right:6px;border-radius:999px;font-size:9px;font-weight:700;color:#fff;min-width:16px;height:16px;display:flex;align-items:center;justify-content:center;padding:0 4px}
.lh{display:flex;align-items:center;gap:10px;padding:14px 0 10px}
.lt{font-size:19px;font-weight:700;flex:1;letter-spacing:-0.02em}
.lc2{font-size:11px;color:#374151;background:#0F1829;border-radius:99px;padding:2px 10px}
.chips{display:flex;gap:5px;overflow-x:auto;padding:0 0 10px}
.chip{background:#0A0F1E;border:1px solid #0F1829;border-radius:999px;color:#4B5563;font-size:11px;padding:4px 10px;cursor:pointer;white-space:nowrap}
.tc{background:#0A0F1E;border:1px solid #0F1829;border-radius:13px;margin-bottom:7px;display:flex;overflow:hidden;cursor:pointer}
.tc.ov{border-color:#F8717155}
.tac{width:3px;flex-shrink:0}
.tb{flex:1;padding:11px 12px 9px;min-width:0}
.tr2{display:flex;gap:9px;align-items:flex-start;margin-bottom:7px}
.sbtn{width:26px;height:26px;border-radius:7px;border:none;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:11px;flex-shrink:0;cursor:pointer}
.tt{font-size:13px;font-weight:500;line-height:1.4}
.tt.dn{text-decoration:line-through;opacity:.4}
.tn{font-size:11px;color:#4B5563;margin-top:4px;line-height:1.5}
.td{font-size:10px;flex-shrink:0;color:#6B7280}
.td.ov{color:#F87171}
.mr{display:flex;flex-wrap:wrap;gap:4px}
.bdg{font-size:10px;padding:2px 6px;border-radius:5px;font-weight:500}
.tact{display:flex;gap:8px;margin-top:10px}
.eb{background:#0F1829;border:none;border-radius:8px;color:#6B7280;font-size:12px;padding:5px 12px}
.db{background:transparent;border:none;color:#F87171;font-size:12px}
.abar{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px}
.ap{border-radius:10px;padding:10px 6px;text-align:center}
.dh{display:flex;align-items:center;gap:8px;margin-bottom:7px;padding:4px 0}
.dlb{font-size:12px;font-weight:600}
.ddt{font-size:10px;color:#374151;flex:1}
.dc{background:#0F1829;color:#4B5563;font-size:10px;border-radius:99px;padding:1px 7px}
.lce{background:#0A0F1E;border:1px solid #0F1829;border-radius:10px;padding:9px 12px;margin-bottom:5px;display:flex;gap:9px;align-items:flex-start}
.la{width:3px;min-height:22px;border-radius:99px;flex-shrink:0;margin-top:1px}
.ltx{font-size:12px;color:#C8D6E5;line-height:1.5;margin-bottom:4px}
.ldel{background:transparent;border:none;color:#374151;font-size:14px;cursor:pointer;padding:0 2px;flex-shrink:0}
.rh{background:linear-gradient(135deg,#4F8EF715,#A78BFA15);border:1px solid #4F8EF733;border-radius:14px;padding:16px;margin-bottom:16px}
.rw{font-size:13px;font-weight:600;margin-bottom:4px}
.rs{font-size:12px;color:#4B5563;margin-bottom:14px}
.gbtn{width:100%;padding:12px;background:linear-gradient(135deg,#4F8EF7,#A78BFA);border:none;border-radius:10px;color:#fff;font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px}
.gbtn:disabled{opacity:.6}
.racts{display:flex;gap:8px;margin-bottom:12px}
.rab{flex:1;padding:10px;background:#0A0F1E;border:1px solid #1F2937;border-radius:10px;color:#94A3B8;font-size:13px}
.rbox{background:#0A0F1E;border:1px solid #1F2937;border-radius:12px;padding:14px;overflow-x:auto}
.rpre{margin:0;color:#C8D6E5;font-size:11px;line-height:1.8;white-space:pre-wrap;font-family:monospace}
#nav{position:absolute;bottom:0;left:0;right:0;background:#080C14;border-top:1px solid #0F1829;display:flex;justify-content:space-around;padding:8px 0 22px;z-index:30}
.ntab{display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:none;color:#1F2937;padding:4px 2px;position:relative;min-width:44px}
.ntab.on{color:#4F8EF7}
.niw{font-size:18px;position:relative;display:inline-block}
.nbdg{position:absolute;top:-1px;right:-3px;border-radius:999px;font-size:8px;font-weight:700;color:#fff;min-width:14px;height:14px;display:none;align-items:center;justify-content:center;padding:0 3px}
.nlbl{font-size:9px;font-weight:500;text-transform:uppercase;letter-spacing:.04em}
#fab{position:absolute;bottom:78px;right:16px;width:50px;height:50px;border-radius:50%;background:linear-gradient(135deg,#4F8EF7,#A78BFA);border:none;color:#fff;font-size:24px;box-shadow:0 4px 18px #4F8EF755;display:flex;align-items:center;justify-content:center;z-index:31}
.ovl{position:fixed;inset:0;background:#00000090;z-index:50;display:flex;align-items:flex-end}
.mdl{background:#0A0F1E;border-radius:20px 20px 0 0;width:100%;max-width:430px;margin:0 auto;max-height:88vh;overflow-y:auto;padding:0 16px 40px}
.mhdl{width:36px;height:4px;background:#1F2937;border-radius:99px;margin:12px auto 16px}
.mhd{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.mttl{font-size:18px;font-weight:700}
.mclb{background:#0F1829;border:none;border-radius:8px;color:#4B5563;font-size:16px;padding:6px 10px}
.fld{margin-bottom:14px}
.flbl{font-size:10px;color:#4B5563;text-transform:uppercase;letter-spacing:.1em;margin-bottom:6px;font-weight:600;display:block}
.inp{width:100%;background:#080C14;border:1px solid #1F2937;border-radius:10px;padding:10px 12px;color:#E2E8F0;font-size:14px;outline:none}
.inpta{width:100%;background:#080C14;border:1px solid #1F2937;border-radius:10px;padding:10px 12px;color:#E2E8F0;font-size:14px;outline:none;height:68px;resize:none;display:block}
.sel{width:100%;background:#080C14;border:1px solid #1F2937;border-radius:10px;padding:10px 12px;color:#E2E8F0;font-size:14px;outline:none;cursor:pointer;display:block}
.r2{display:flex;gap:10px;margin-bottom:14px}
.r2>div{flex:1}
.ccs{display:flex;flex-wrap:wrap;gap:6px}
.cc{background:#080C14;border:1px solid #1F2937;border-radius:99px;color:#4B5563;font-size:11px;padding:5px 10px;cursor:pointer}
.tagrow{display:flex;gap:6px;margin-bottom:6px}
.tadd{background:#0F1829;border:none;border-radius:10px;color:#6B7280;font-size:13px;padding:10px 14px}
.tw{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.tb2{display:inline-flex;align-items:center;gap:4px;background:#4F8EF722;color:#4F8EF7;border-radius:6px;font-size:11px;padding:3px 8px}
.tx{background:none;border:none;color:inherit;cursor:pointer;padding:0;font-size:14px;line-height:1}
.svbtn{width:100%;padding:13px;background:linear-gradient(135deg,#4F8EF7,#A78BFA);border:none;border-radius:12px;color:#fff;font-size:15px;font-weight:700;margin-top:8px;display:block}
.svbtn:disabled{background:#1F2937;color:#4B5563}
.crow{display:flex;flex-direction:column;gap:6px;margin-bottom:20px}
.crb{display:flex;align-items:center;gap:12px;padding:12px;background:#080C14;border:1px solid #0F1829;border-radius:10px;cursor:pointer;outline:none;width:100%;text-align:left}
.acb{background:#080C14;border:1px solid #0F1829;border-radius:14px;padding:14px}
.igrid{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px}
.ibtn{background:#0A0F1E;border:1px solid #1F2937;border-radius:8px;font-size:15px;padding:5px 7px;cursor:pointer}
.ibtn.picked{background:#4F8EF722;border-color:#4F8EF7}
</style>
</head>
<body>
<div id="app">
  <div id="hdr">
    <div>
      <div class="brand">&#9001; Second Brain</div>
      <div class="sr"><span id="sdot"></span><span id="stxt">Starting...</span></div>
    </div>
    <div class="hbs">
      <button class="hb" id="keyBtn">&#128273; Key</button>
      <button class="hb" id="logBtn">&#128203; Log</button>
    </div>
  </div>
  <div id="apanel">
    <div style="font-size:11px;color:#6B7280;margin-bottom:8px">Anthropic API Key (saved on device only)</div>
    <div class="arow">
      <input type="password" id="akey" placeholder="sk-ant-api03-..."/>
      <button class="asave" id="aSaveBtn">Save</button>
      <button class="acanc" id="aCancBtn">X</button>
    </div>
    <div style="font-size:10px;color:#374151">Get key: console.anthropic.com &rarr; API Keys</div>
  </div>
  <div id="body"></div>
  <div id="nav">
    <button class="ntab on" id="nt0"><span class="niw">&#127968;</span><span class="nlbl">Home</span></button>
    <button class="ntab" id="nt1"><span class="niw">&#128188;<span class="nbdg" id="nb1" style="background:#4F8EF7"></span></span><span class="nlbl">Work</span></button>
    <button class="ntab" id="nt2"><span class="niw">&#128640;<span class="nbdg" id="nb2" style="background:#A78BFA"></span></span><span class="nlbl">Projects</span></button>
    <button class="ntab" id="nt3"><span class="niw">&#128203;<span class="nbdg" id="nb3" style="background:#34D399"></span></span><span class="nlbl">Log</span></button>
    <button class="ntab" id="nt4"><span class="niw">&#128202;</span><span class="nlbl">Report</span></button>
    <button class="ntab" id="nt5"><span class="niw">&#8230;</span><span class="nlbl">More</span></button>
  </div>
  <button id="fab">+</button>
</div>
<div id="mc"></div>
<script src="app.js"></script>
</body>
</html>
