<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="theme-color" content="#080C14"/>
<title>Second Brain</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  background:#080C14;
  color:#E2E8F0;
  font-family:Arial,sans-serif;
}

#wrap{
  max-width:430px;
  margin:auto;
  min-height:100vh;
}

#hdr{
  padding:14px 16px;
  border-bottom:1px solid #1F2937;
  display:flex;
  justify-content:space-between;
  align-items:center;
  position:sticky;
  top:0;
  background:#080C14;
  z-index:10;
}

#body{
  padding:16px;
  padding-bottom:120px;
}

#nav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:#111827;
  display:flex;
  justify-content:space-around;
  padding:10px 0 20px;
  border-top:1px solid #1F2937;
}

.nt{
  background:none;
  border:none;
  color:#6B7280;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:4px;
  font-size:11px;
}

.nt.on{
  color:#4F8EF7;
}

.sg{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
  margin:18px 0;
}

.sc{
  background:#111827;
  border-radius:14px;
  padding:16px;
  text-align:center;
}

.sv{
  font-size:28px;
  font-weight:700;
}

.sl{
  margin-top:6px;
  font-size:11px;
  color:#6B7280;
}

.cg{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
}

.ct{
  background:#111827;
  border-radius:16px;
  padding:18px;
}

.tc{
  background:#111827;
  border-radius:14px;
  padding:14px;
  margin-bottom:12px;
}

.bad{
  display:inline-block;
  margin-top:8px;
  margin-right:6px;
  background:#1F2937;
  padding:4px 8px;
  border-radius:6px;
  font-size:10px;
}

.sync{
  background:#111827;
  border:none;
  border-radius:10px;
  color:white;
  padding:8px 14px;
}

pre{
  white-space:pre-wrap;
  line-height:1.7;
  font-size:12px;
}

</style>
</head>

<body>

<div id="wrap">

<div id="hdr">

<div style="font-size:18px;font-weight:700;">
Second Brain
</div>

<div style="display:flex;align-items:center;gap:12px;">

<button class="sync" onclick="syncDb()">
Sync
</button>

<div id="st" style="font-size:12px;color:#34D399;">
Ready
</div>

</div>

</div>

<div id="body"></div>

</div>

<div id="nav">

<button class="nt on" onclick="tab('home')">
<div>🏠</div>
<div>Home</div>
</button>

<button class="nt" onclick="tab('work')">
<div>💼</div>
<div>Work</div>
</button>

<button class="nt" onclick="tab('projects')">
<div>🚀</div>
<div>Projects</div>
</button>

<button class="nt" onclick="tab('log')">
<div>📋</div>
<div>Log</div>
</button>

<button class="nt" onclick="tab('report')">
<div>📊</div>
<div>Report</div>
</button>

</div>

<script>

const DB = {
  tasks:'./data/sb-tasks.json',
  worklog:'./data/sb-worklog.json',
  categories:'./data/sb-categories.json'
};

let tasks=[];
let worklog=[];
let cats=[];
let current='home';

function setStatus(t,c){
  const s=document.getElementById('st');
  s.innerText=t;
  s.style.color=c||'#34D399';
}

async function getJson(url){

  const r=await fetch(url+'?v='+Date.now());

  if(!r.ok){
    throw new Error('Fetch failed');
  }

  return await r.json();
}

async function syncDb(){

  try{

    setStatus('Syncing...','#FBBF24');

    const t=await getJson(DB.tasks);
    const w=await getJson(DB.worklog);
    const c=await getJson(DB.categories);

    tasks=t.items||[];
    worklog=w.entries||[];
    cats=c.categories||[];

    localStorage.setItem('sb_tasks',JSON.stringify(tasks));
    localStorage.setItem('sb_worklog',JSON.stringify(worklog));
    localStorage.setItem('sb_categories',JSON.stringify(cats));

    setStatus('Synced','#34D399');

    render();

  }catch(e){

    console.log(e);

    setStatus('Failed','#F87171');

    alert('Database load failed');

  }

}

function loadLocal(){

  tasks=JSON.parse(localStorage.getItem('sb_tasks')||'[]');
  worklog=JSON.parse(localStorage.getItem('sb_worklog')||'[]');
  cats=JSON.parse(localStorage.getItem('sb_categories')||'[]');

}

function tab(t){

  current=t;

  const n=document.querySelectorAll('.nt');

  n.forEach(x=>x.classList.remove('on'));

  const arr=['home','work','projects','log','report'];

  n[arr.indexOf(t)].classList.add('on');

  render();

}

function render(){

  const b=document.getElementById('body');

  if(current==='home'){
    b.innerHTML=homeHtml();
  }

  if(current==='work'){
    b.innerHTML=taskHtml('work');
  }

  if(current==='projects'){
    b.innerHTML=taskHtml('projects');
  }

  if(current==='log'){
    b.innerHTML=logHtml();
  }

  if(current==='report'){
    b.innerHTML=reportHtml();
  }

}

function homeHtml(){

  const done=tasks.filter(x=>x.status==='done').length;

  return `

<h1 style="font-size:32px;font-weight:700;margin-bottom:6px;">
Your Second Brain
</h1>

<div style="color:#94A3B8;margin-bottom:20px;">
${new Date().toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'})}
</div>

<div class="sg">

<div class="sc">
<div class="sv" style="color:#4F8EF7;">
${tasks.length}
</div>
<div class="sl">TOTAL</div>
</div>

<div class="sc">
<div class="sv" style="color:#34D399;">
${done}
</div>
<div class="sl">DONE</div>
</div>

<div class="sc">
<div class="sv" style="color:#FBBF24;">
${worklog.length}
</div>
<div class="sl">LOGS</div>
</div>

<div class="sc">
<div class="sv" style="color:#F87171;">
${tasks.filter(x=>x.status!=='done').length}
</div>
<div class="sl">OPEN</div>
</div>

</div>

<div style="font-size:13px;color:#6B7280;font-weight:700;margin-bottom:12px;">
CATEGORIES
</div>

<div class="cg">

<div class="ct">
<div style="font-size:16px;font-weight:700;">
Work
</div>
<div style="margin-top:8px;color:#6B7280;">
${tasks.filter(x=>x.category==='work').length} tasks
</div>
</div>

<div class="ct">
<div style="font-size:16px;font-weight:700;">
Projects
</div>
<div style="margin-top:8px;color:#6B7280;">
${tasks.filter(x=>x.category==='projects').length} tasks
</div>
</div>

<div class="ct">
<div style="font-size:16px;font-weight:700;">
Worklog
</div>
<div style="margin-top:8px;color:#6B7280;">
${worklog.length} entries
</div>
</div>

<div class="ct">
<div style="font-size:16px;font-weight:700;">
Reports
</div>
<div style="margin-top:8px;color:#6B7280;">
Weekly updates
</div>
</div>

</div>

`;

}

function taskHtml(cat){

  const list=tasks.filter(x=>x.category===cat);

  let h='';

  h+='<h2 style="font-size:28px;font-weight:700;margin-bottom:18px;">'+cat+'</h2>';

  list.forEach(t=>{

    h+='<div class="tc">';

    h+='<div style="font-size:15px;font-weight:700;">';
    h+=t.title;
    h+='</div>';

    h+='<div style="margin-top:8px;color:#94A3B8;font-size:12px;">';
    h+=(t.notes||'');
    h+='</div>';

    h+='<span class="bad">'+(t.priority||'normal')+'</span>';
    h+='<span class="bad">'+(t.status||'todo')+'</span>';

    if(t.dueDate){
      h+='<span class="bad">'+t.dueDate+'</span>';
    }

    h+='</div>';

  });

  return h;

}

function logHtml(){

  let h='';

  h+='<h2 style="font-size:28px;font-weight:700;margin-bottom:18px;">Worklog</h2>';

  worklog.forEach(w=>{

    h+='<div class="tc">';

    h+='<div style="font-size:12px;color:#6B7280;margin-bottom:6px;">';
    h+=(w.date||'');
    h+='</div>';

    h+='<div style="font-size:14px;">';
    h+=(w.text||'');
    h+='</div>';

    h+='</div>';

  });

  return h;

}

function reportHtml(){

  return `

<h2 style="font-size:28px;font-weight:700;margin-bottom:18px;">
Weekly Report
</h2>

<div class="tc">

<pre>
Hi Sir,

Please find below my weekly work update:

Tasks Loaded: ${tasks.length}

Worklog Entries: ${worklog.length}

Projects:
${tasks.filter(x=>x.category==='projects').length}

Work:
${tasks.filter(x=>x.category==='work').length}

Thanks,
Abhi Kapoor
</pre>

</div>

`;

}

loadLocal();
render();
syncDb();

</script>

</body>
</html>
