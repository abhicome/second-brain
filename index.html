function weekRange() {
const d=new Date(),day=d.getDay();
const mon=new Date(d); mon.setDate(d.getDate()-((day+6)%7));
const sun=new Date(mon); sun.setDate(mon.getDate()+6);
const fmt=x=>x.toLocaleDateString(“en-GB”,{day:“2-digit”,month:“short”,year:“numeric”});
return {start:mon.toISOString().slice(0,10),end:sun.toISOString().slice(0,10),label:`${fmt(mon)} – ${fmt(sun)}`};
}

function fmtDate(iso) {
if(!iso) return “”;
const today=new Date(); today.setHours(0,0,0,0);
const dt=new Date(iso); dt.setHours(0,0,0,0);
const diff=Math.round((dt-today)/86400000);
if(diff===0) return “Today”;
if(diff===1) return “Tomorrow”;
if(diff===-1) return “Yesterday”;
if(diff<0) return `${Math.abs(diff)}d ago`;
if(diff<8) return new Date(iso).toLocaleDateString(“en-US”,{weekday:“short”});
return new Date(iso).toLocaleDateString(“en-US”,{month:“short”,day:“numeric”});
}

// ── DRIVE API (via Claude as middleware) ───────────────────────────────────────
async function driveRead(fileId) {
const apiKey = window._ANTHROPIC_KEY;
if (!apiKey) return null;
try {
const res = await fetch(“https://api.anthropic.com/v1/messages”, {
method:“POST”,
headers:{“Content-Type”:“application/json”,“x-api-key”:apiKey,“anthropic-version”:“2023-06-01”,“anthropic-beta”:“mcp-client-2025-04-04”},
body:JSON.stringify({
model:MODEL, max_tokens:4000,
system:`You have Google Drive access. Read the file with ID "${fileId}" and return ONLY its raw JSON. No explanation, no markdown.`,
messages:[{role:“user”,content:“Read the file and return raw JSON only.”}],
mcp_servers:[{type:“url”,url:DRIVE_MCP,name:“gdrive”}]
})
});
const data = await res.json();
for (const b of data.content||[]) {
if(b.type===“mcp_tool_result”){const t=b?.content?.[0]?.text||””;try{return JSON.parse(t)}catch{}}
}
for (const b of data.content||[]) {
if(b.type===“text”){const m=b.text.match(/{[\s\S]*}/);if(m)try{return JSON.parse(m[0])}catch{}}
}
} catch {}
return null;
}

async function driveWrite(fileId, obj) {
const apiKey = window._ANTHROPIC_KEY;
if (!apiKey) return;
try {
await fetch(“https://api.anthropic.com/v1/messages”, {
method:“POST”,
headers:{“Content-Type”:“application/json”,“x-api-key”:apiKey,“anthropic-version”:“2023-06-01”,“anthropic-beta”:“mcp-client-2025-04-04”},
body:JSON.stringify({
model:MODEL, max_tokens:300,
system:`You have Google Drive access. Overwrite the file with ID "${fileId}" with the exact JSON content provided. Reply only: saved`,
messages:[{role:“user”,content:`Save this JSON:\n${JSON.stringify({...obj,lastUpdated:nowISO()},null,2)}`}],
mcp_servers:[{type:“url”,url:DRIVE_MCP,name:“gdrive”}]
})
});
} catch {}
}

setSyncing(true); setSyncMsg(“Saving…”);

setSyncMsg(“✓ Saved”); setSyncing(false);
}, 1000);
}

// Task CRUD
function submitTask(f) {
const updated = {…f, updatedAt:nowISO()};
persistTasks(editTask
? tasks.map(t=>t.id===editTask.id?updated:t)
: [{…updated,id:uid(),createdAt:nowISO()},…tasks]
);
setShowForm(false); setEditTask(null); setForm(blankTask());
}
function deleteTask(id)  { persistTasks(tasks.filter(t=>t.id!==id)); }
function cycleStatus(id) {
const ord=[“todo”,“inprogress”,“done”,“blocked”,“someday”];
persistTasks(tasks.map(t=>t.id!==id?t:{…t,status:ord[(ord.indexOf(t.status)+1)%ord.length],updatedAt:nowISO()}));
}
function openEdit(task)  { setForm({…task}); setEditTask(task); setShowForm(true); }
function openAdd(catId)  {
const validCat = cats.find(c=>c.id===catId) ? catId : “personal”;
setForm(blankTask(validCat)); setEditTask(null); setShowForm(true);
}

// Worklog CRUD
function submitLog(f) {
persistWorklog([{…f,id:uid(),createdAt:nowISO()},…worklog]);
setShowLog(false); setLogForm(blankLog());
}
function deleteLog(id) { persistWorklog(worklog.filter(e=>e.id!==id)); }

// Category
function addCat(label,icon,color) {
const newCat={id:label.toLowerCase().replace(/\s+/g,”-”)+”-”+Date.now().toString(36),label,icon,color};
const newCats=[…cats,newCat];
setCats(newCats);
if(apiKey) driveWrite(DRIVE_FILE_IDS.categories,{version:1,categories:newCats});
}

// Weekly report
async function buildReport() {
if (!apiKey) { alert(“Please add your Anthropic API key first (tap the key icon)”); return; }
setReportLoading(true); setReport(””);
const week = weekRange();
const text = await generateReport(tasks, worklog, week, apiKey);
setReport(text); setReportLoading(false);
}
function copyReport() {
navigator.clipboard.writeText(report).then(()=>{setCopied(true);setTimeout(()=>setCopied(false),2000);});
}
function downloadReport() {
const a=document.createElement(“a”);

// ── CATEGORY MANAGER ───────────────────────────────────────────────────────────
function CatModal({cats,tasks,tab,setTab,onAdd,onClose}) {
const [label,setLabel]=useState(””),[icon,setIcon]=useState(“📌”),[color,setColor]=useState(”#8B5CF6”);
const ICONS=[“📌”,“🎯”,“💡”,“🛒”,“📚”,“🎵”,“🏋️”,“✈️”,“🍕”,“🎮”,“📷”,“🌍”,“🤝”,“🏦”,“🎨”,“🔬”,“⚡”,“🧩”];
return(
<div style={{position:“fixed”,inset:0,background:”#00000090”,zIndex:50,display:“flex”,alignItems:“flex-end”}} onClick={onClose}>
<div style={{background:”#0A0F1E”,borderRadius:“20px 20px 0 0”,width:“100%”,maxWidth:430,margin:“0 auto”,maxHeight:“80vh”,overflowY:“auto”,padding:“0 16px 40px”}} onClick={e=>e.stopPropagation()}>
<div style={{width:36,height:4,background:”#1F2937”,borderRadius:99,margin:“12px auto 16px”}}/>
<div style={{display:“flex”,justifyContent:“space-between”,marginBottom:16}}>
<span style={{fontSize:18,fontWeight:700,color:”#E2E8F0”}}>All Categories</span>
<button style={{background:”#0F1829”,border:“none”,borderRadius:8,color:”#4B5563”,fontSize:16,padding:“6px 10px”,cursor:“pointer”}} onClick={onClose}>✕</button>
</div>
<div style={{display:“flex”,flexDirection:“column”,gap:6,marginBottom:20}}>
{cats.map(c=>(
<button key={c.id} style={{display:“flex”,alignItems:“center”,gap:12,padding:“12px”,background:tab===c.id?c.color+“18”:”#080C14”,border:“1px solid #0F1829”,borderRadius:10,cursor:“pointer”,outline:“none”}} onClick={()=>setTab(c.id)}>
<span style={{fontSize:20}}>{c.icon}</span>
<span style={{flex:1,color:”#E2E8F0”,fontSize:14,fontWeight:500,textAlign:“left”}}>{c.label}</span>
<span style={{color:”#4B5563”,fontSize:12,fontFamily:”‘JetBrains Mono’,monospace”}}>{tasks.filter(t=>t.category===c.id).length}</span>
</button>
))}
</div>
<div style={{background:”#080C14”,border:“1px solid #0F1829”,borderRadius:14,padding:14}}>
<div style={S.fl}>New Category</div>
<div style={{display:“flex”,flexWrap:“wrap”,gap:5,marginBottom:10}}>{ICONS.map(ic=><button key={ic} style={{background:icon===ic?”#4F8EF722”:”#0A0F1E”,border:`1px solid ${icon===ic?"#4F8EF7":"#1F2937"}`,borderRadius:8,fontSize:16,padding:“5px 6px”,cursor:“pointer”}} onClick={()=>setIcon(ic)}>{ic}</button>)}</div>
<input style={{…S.inp,marginBottom:8}} value={label} placeholder=“Category name” onChange={e=>setLabel(e.target.value)}/>
<div style={{display:“flex”,alignItems:“center”,gap:10,marginBottom:12}}>
<span style={S.fl}>Color</span>
<input type=“color” value={color} onChange={e=>setColor(e.target.value)} style={{width:36,height:30,border:“none”,borderRadius:6,cursor:“pointer”,background:“transparent”}}/>
</div>
<button style={{width:“100%”,padding:“11px”,background:label.trim()?“linear-gradient(135deg,#4F8EF7,#A78BFA)”:”#1F2937”,border:“none”,borderRadius:12,color:label.trim()?”#fff”:”#4B5563”,fontSize:14,fontWeight:700,cursor:“pointer”}}
disabled={!label.trim()} onClick={()=>{onAdd(label.trim(),icon,color);setLabel(””);}}>Create Category</button>
</div>
</div>
</div>
);
}

function NavTab({icon,label,active,onPress,color,badge}) {
return(
<button style={{display:“flex”,flexDirection:“column”,alignItems:“center”,gap:2,background:“none”,border:“none”,color:active?(color||”#4F8EF7”):”#1F2937”,cursor:“pointer”,padding:“4px 2px”,position:“relative”,minWidth:44}} onClick={onPress}>
<span style={{fontSize:18,position:“relative”}}>
{icon}
{badge>0&&<span style={{position:“absolute”,top:-1,right:-3,borderRadius:999,fontSize:8,fontWeight:700,color:”#fff”,minWidth:14,height:14,display:“flex”,alignItems:“center”,justifyContent:“center”,padding:“0 3px”,background:color||”#4F8EF7”}}>{badge>9?“9+”:badge}</span>}
</span>
<span style={{fontSize:9,fontWeight:500,textTransform:“uppercase”,letterSpacing:“0.04em”}}>{label}</span>
</button>
);
}

function FL({label,children}) {
return <div style={{marginBottom:14}}><div style={S.fl}>{label}</div>{children}</div>;
}

fl:{fontSize:10,color:”#4B5563”,textTransform:“uppercase”,letterSpacing:“0.1em”,marginBottom:6,fontWeight:600,display:“block”},
};

ReactDOM.createRoot(document.getElementById(“root”)).render(<App/>);
</script>
