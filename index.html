<!DOCTYPE html>

<html>
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#080C14;color:#E2E8F0;font-family:sans-serif}
#app{max-width:430px;margin:auto;min-height:100vh;display:flex;flex-direction:column}
#hdr{padding:14px 16px;border-bottom:1px solid #1F2937;display:flex;justify-content:space-between;align-items:center;background:#080C14;position:sticky;top:0}
#body{flex:1;overflow:auto;padding:16px;padding-bottom:100px}
#nav{position:fixed;bottom:0;width:100%;max-width:430px;background:#111827;display:flex;justify-content:space-around;padding:10px 0 20px;border-top:1px solid #1F2937}
.ntab{background:none;border:none;color:#4B5563;cursor:pointer;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 8px}
.ntab.on{color:#4F8EF7}
.ntab span:first-child{font-size:18px}
</style>
</head>
<body>
<div id="app">
  <div id="hdr">
    <div style="font-size:17px;font-weight:700">Second Brain</div>
    <div style="font-size:10px;color:#34D399" id="stxt">Ready</div>
  </div>
  <div id="body">
    <p style="color:yellow;font-size:16px;padding:20px">Step 1: HTML renders</p>
  </div>
  <div id="nav">
    <button class="ntab on" onclick="setTab('home')"><span>&#127968;</span><span>Home</span></button>
    <button class="ntab" onclick="setTab('work')"><span>&#128188;</span><span>Work</span></button>
    <button class="ntab" onclick="setTab('projects')"><span>&#128640;</span><span>Projects</span></button>
    <button class="ntab" onclick="setTab('log')"><span>&#128203;</span><span>Log</span></button>
    <button class="ntab" onclick="setTab('report')"><span>&#128202;</span><span>Report</span></button>
  </div>
</div>
<script>
// Step 2: does script run?
document.getElementById('body').innerHTML = '<p style="color:#34D399;font-size:16px;padding:20px">Step 2: Script runs OK</p>';

// Step 3: does render() work?
var tasks = [
{id:‘1’,title:‘DHCP Scope Failover UAT’,category:‘work’,priority:‘urgent’,status:‘inprogress’,dueDate:‘2026-05-09’,notes:‘Discuss with Vikas’},
{id:‘2’,title:‘PacketFence Patching’,category:‘work’,priority:‘high’,status:‘inprogress’,dueDate:‘2026-05-25’,notes:‘PFE01 pending’},
{id:‘3’,title:‘SailPoint Pre Migration’,category:‘projects’,priority:‘urgent’,status:‘inprogress’,dueDate:‘2026-05-08’,notes:‘DC updates’},
{id:‘4’,title:‘AD Transformation’,category:‘projects’,priority:‘high’,status:‘inprogress’,dueDate:‘2026-05-08’,notes:‘Awaiting MS’}
];

var tab = ‘home’;

function setTab(t) {
tab = t;
document.querySelectorAll(’.ntab’).forEach(function(el){ el.classList.remove(‘on’); });
var tabs = [‘home’,‘work’,‘projects’,‘log’,‘report’];
var idx = tabs.indexOf(t);
if (idx >= 0) document.querySelectorAll(’.ntab’)[idx].classList.add(‘on’);
render();
}

function render() {
var b = document.getElementById(‘body’);

if (tab !== ‘home’) {
var list = tasks.filter(function(t){ return t.category === tab; });
var html = ‘<h2 style="margin-bottom:16px;text-transform:capitalize">’ + tab + ‘</h2>’;
list.forEach(function(t){
html += ‘<div style="background:#111827;border-radius:12px;padding:14px;margin-bottom:10px">’
+ ‘<div style="font-weight:600">’ + t.title + ‘</div>’
+ ‘<div style="font-size:12px;color:#94A3B8;margin-top:4px">’ + t.notes + ‘</div>’
+ ‘<div style="margin-top:8px;font-size:10px;color:#6B7280">’ + t.priority + ’ • ’ + t.status + ‘</div>’
+ ‘</div>’;
});
if (!list.length) html += ‘<p style="color:#6B7280">No tasks here</p>’;
b.innerHTML = html;
return;
}

// Home view
var done = tasks.filter(function(t){ return t.status === ‘done’; }).length;
var inp  = tasks.filter(function(t){ return t.status === ‘inprogress’; }).length;

b.innerHTML = ‘’
+ ‘<h1 style="font-size:24px;font-weight:700;margin-bottom:6px">Your Second Brain</h1>’
+ ‘<p style="color:#94A3B8;font-size:12px;margin-bottom:16px">’ + new Date().toLocaleDateString(‘en-US’,{weekday:‘long’,month:‘long’,day:‘numeric’}) + ‘</p>’
+ ‘<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:20px">’
+ ‘<div style="background:#111827;padding:12px;border-radius:12px;text-align:center"><div style="font-size:20px;font-weight:700;color:#4F8EF7">’ + tasks.length + ‘</div><div style="font-size:9px;color:#6B7280;margin-top:4px">TOTAL</div></div>’
+ ‘<div style="background:#111827;padding:12px;border-radius:12px;text-align:center"><div style="font-size:20px;font-weight:700;color:#34D399">’ + done + ‘</div><div style="font-size:9px;color:#6B7280;margin-top:4px">DONE</div></div>’
+ ‘<div style="background:#111827;padding:12px;border-radius:12px;text-align:center"><div style="font-size:20px;font-weight:700;color:#FBBF24">’ + inp + ‘</div><div style="font-size:9px;color:#6B7280;margin-top:4px">ACTIVE</div></div>’
+ ‘<div style="background:#111827;padding:12px;border-radius:12px;text-align:center"><div style="font-size:20px;font-weight:700;color:#F87171">0</div><div style="font-size:9px;color:#6B7280;margin-top:4px">OVERDUE</div></div>’
+ ‘</div>’
+ ‘<div style="font-size:10px;color:#6B7280;text-transform:uppercase;letter-spacing:.08em;font-weight:600;margin-bottom:10px">Categories</div>’
+ ‘<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px">’
+ ‘<button onclick="setTab(\'work\')" style="background:#111827;border:1px solid #4F8EF744;border-radius:14px;padding:16px;cursor:pointer;color:white;text-align:center">Work<br><span style="font-size:11px;color:#6B7280">’ + tasks.filter(function(t){return t.category===‘work’;}).length + ’ tasks</span></button>’
+ ‘<button onclick="setTab(\'projects\')" style="background:#111827;border:1px solid #A78BFA44;border-radius:14px;padding:16px;cursor:pointer;color:white;text-align:center">Projects<br><span style="font-size:11px;color:#6B7280">’ + tasks.filter(function(t){return t.category===‘projects’;}).length + ’ tasks</span></button>’
+ ‘<button style="background:#111827;border:1px solid #34D39944;border-radius:14px;padding:16px;color:#6B7280;text-align:center">Personal<br><span style="font-size:11px">0 tasks</span></button>’
+ ‘</div>’;
}

render();
document.getElementById(‘stxt’).textContent = ‘Loaded ’ + tasks.length + ’ tasks’;
</script>

</body>
</html>
