function uid() { return Math.random().toString(36).slice(2) + Date.now().toString(36); }
function nowISO() { return new Date().toISOString(); }
function todayStr() { return new Date().toISOString().slice(0, 10); }

function weekRange() {
var d = new Date(), day = d.getDay();
var mon = new Date(d);
mon.setDate(d.getDate() - ((day + 6) % 7));
var sun = new Date(mon);
sun.setDate(mon.getDate() + 6);
function fmt(x) { return x.toLocaleDateString(‘en-GB’, {day:‘2-digit’,month:‘short’,year:‘numeric’}); }
return {
start: mon.toISOString().slice(0, 10),
end: sun.toISOString().slice(0, 10),
label: fmt(mon) + ’ - ’ + fmt(sun)
};
}

function fdate(iso) {
if (!iso) return ‘’;
var today = new Date();
today.setHours(0, 0, 0, 0);
var dt = new Date(iso);
dt.setHours(0, 0, 0, 0);
var diff = Math.round((dt - today) / 86400000);
if (diff === 0) return ‘Today’;
if (diff === 1) return ‘Tomorrow’;
if (diff === -1) return ‘Yesterday’;
if (diff < 0) return Math.abs(diff) + ‘d ago’;
if (diff < 8) return new Date(iso).toLocaleDateString(‘en-US’, {weekday:‘short’});
return new Date(iso).toLocaleDateString(‘en-US’, {month:‘short’, day:‘numeric’});
}

function isOv(t) {
return t.dueDate && t.status !== ‘done’ && new Date(t.dueDate) < new Date(new Date().toDateString());
}

function getC(id) { return S.cats.find(function(c) { return c.id === id; }) || S.cats[0]; }

function getS(id) { return STAT.find(function(s) { return s.id === id; }) || STAT[0]; }

function esc(s) {
return (s || ‘’).replace(/&/g,’&’).replace(/</g,’<’).replace(/>/g,’>’).replace(/”/g,’"’);
}

async function callAI(sys, usr, mx, useMCP) {
var body = {
model: MODEL,
max_tokens: mx || 1000,
system: sys,
messages: [{role: ‘user’, content: usr}]
};
if (useMCP) {
body.mcp_servers = [{type: ‘url’, url: DMCP, name: ‘gdrive’}];
}
var r = await fetch(‘https://api.anthropic.com/v1/messages’, {
method: ‘POST’,
headers: {
‘Content-Type’: ‘application/json’,
‘x-api-key’: S.apiKey,
‘anthropic-version’: ‘2023-06-01’,
‘anthropic-beta’: ‘mcp-client-2025-04-04’
},
body: JSON.stringify(body)
});
return r.json();
}

async function driveRead(fid) {
if (!S.apiKey) return null;
try {
var d = await callAI(
‘You have Google Drive access. Read file ID “’ + fid + ‘”. Return ONLY raw JSON, no markdown.’,
‘Read file, return JSON only.’,
4000,
true
);
var i, b, t, m;
for (i = 0; i < (d.content || []).length; i++) {
b = d.content[i];
if (b.type === ‘mcp_tool_result’) {
t = (b.content && b.content[0] && b.content[0].text) || ‘’;
try { return JSON.parse(t); } catch(e) {}
}
}
for (i = 0; i < (d.content || []).length; i++) {
b = d.content[i];
if (b.type === ‘text’) {
m = b.text.match(/{[\s\S]*}/);
if (m) { try { return JSON.parse(m[0]); } catch(e) {} }
}
}
} catch(e) {}
return null;
}

async function driveWrite(fid, obj) {
if (!S.apiKey) return;
try {
obj.lastUpdated = nowISO();
await callAI(
‘You have Google Drive access. Overwrite file ID “’ + fid + ‘” with exact JSON provided. Reply: saved’,
‘Save:\n’ + JSON.stringify(obj, null, 2),
200,
true
);
} catch(e) {}
}

function debSave(key, fid, data) {
clearTimeout(timers[key]);
timers[key] = setTimeout(async function() {
setSyncDot(’#FBBF24’, ‘Saving…’);
await driveWrite(fid, data);
setSyncDot(’#34D399’, ‘Saved’);
}, 1200);
}

return ‘<button class="ct" style="border-color:' + c.color + '44" onclick="setTab(\'' + c.id + '\')"><span style="font-size:20px">’ + esc(c.icon) + ‘</span><span style="font-size:11px;color:#6B7280;font-weight:500">’ + esc(c.label) + ‘</span>’ + (cnt > 0 ? ‘<span class="cba" style="background:' + c.color + '">’ + cnt + ‘</span>’ : ‘’) + ‘</button>’;
}).join(’’);

return ‘<div class="pg"><div class="hero"><div class="hdate">’ + new Date().toLocaleDateString(‘en-US’, {weekday:‘long’,month:‘long’,day:‘numeric’}) + ‘</div><div class="htitle">Your Second Brain</div><div class="hsub">’ + (tasks.length - done) + ’ open - ’ + pct + ‘% complete</div><div class="bt"><div class="bf" style="width:' + pct + '%"></div></div></div><div class="sg"><div class="sc"><div class="sv" style="color:#4F8EF7">’ + tasks.length + ‘</div><div class="sl">Total</div></div><div class="sc"><div class="sv" style="color:#34D399">’ + done + ‘</div><div class="sl">Done</div></div><div class="sc"><div class="sv" style="color:#FBBF24">’ + inp + ‘</div><div class="sl">Active</div></div><div class="sc"><div class="sv" style="color:#F87171">’ + ovList.length + ‘</div><div class="sl">Overdue</div></div></div>’ + oal + (urg.length ? ‘<span class="stl">Urgent & High Priority</span>’ + uc : ‘’) + ‘<div class="wb"><div><div class="wl">’ + wk.label + ‘</div><div class="ws">Tap to generate weekly report</div></div><button class="wbtn" onclick="setTab(\'report\')">Generate</button></div><span class="stl">Categories</span><div class="cg">’ + cg + ‘</div></div>’;
}

function renderList() {
var c = getC(S.tab);
var list = S.tasks.filter(function(t) { return t.category === S.tab; });
if (S.fStatus !== ‘all’) list = list.filter(function(t) { return t.status === S.fStatus; });
list = list.sort(function(a, b) {
var p = [‘urgent’,‘high’,‘normal’,‘low’];
return p.indexOf(a.priority) - p.indexOf(b.priority) || new Date(b.updatedAt) - new Date(a.updatedAt);
});
var chips = [{id:‘all’,label:‘All’}].concat(STAT).map(function(s) {
var sc = STAT.find(function(x) { return x.id === s.id; });
var on = S.fStatus === s.id;
var style = on && sc ? ‘background:’ + sc.color + ‘22;color:’ + sc.color + ‘;border-color:’ + sc.color : ‘’;
return ‘<button class="chip" style="' + style + '" onclick="S.fStatus=\'' + s.id + '\';render()">’ + s.label + ‘</button>’;
}).join(’’);
var cards = list.length ? list.map(renderTC).join(’’) : ‘<div style="text-align:center;padding:40px 0;color:#374151">Nothing here - tap + to add</div>’;
return ‘<div class="pg"><div class="lh"><span style="font-size:20px">’ + esc(c.icon) + ‘</span><span class="lt">’ + esc(c.label) + ‘</span><span class="lc">’ + list.filter(function(t) { return t.status !== ‘done’; }).length + ’ open</span></div><div class="chips">’ + chips + ‘</div>’ + cards + ‘<div style="height:20px"></div></div>’;
}

function renderTC(t) {
var c = getC(t.category), p = getP(t.priority), s = getS(t.status), ov = isOv(t), exp = S.expId === t.id;
var icons = {todo:‘O’, inprogress:’>’, done:‘OK’, blocked:‘X’, someday:’~’};
var icon = icons[t.status] || ‘O’;
var tags = (t.tags || []).map(function(tg) {
return ‘<span class="bdg" style="background:#0F1829;color:#4B5563">#’ + esc(tg) + ‘</span>’;
}).join(’’);
var html = ‘<div class="tc' + (ov ? ' ov' : '') + '" onclick="togExp(\'' + t.id + '\')">’;
html += ‘<div class="tac" style="background:' + c.color + '"></div>’;
html += ‘<div class="tb"><div class="tr">’;
html += ‘<button class="sb" style="background:' + s.color + '22;color:' + s.color + '" onclick="event.stopPropagation();cycleStatus(\'' + t.id + '\')">’ + icon + ‘</button>’;
html += ‘<div style="flex:1;min-width:0"><div class="tt' + (t.status === 'done' ? ' dn' : '') + '">’ + esc(t.title) + ‘</div>’ + (exp && t.notes ? ‘<div class="tn">’ + esc(t.notes) + ‘</div>’ : ‘’) + ‘</div>’;
html += (t.dueDate ? ‘<span class="td' + (ov ? ' ov' : '') + '">’ + (ov ? ’! ’ : ‘’) + fdate(t.dueDate) + ‘</span>’ : ‘’);
html += ‘</div><div class="mr"><span class="bdg" style="background:' + p.color + '22;color:' + p.color + '">’ + p.label + ‘</span><span class="bdg" style="background:' + s.color + '22;color:' + s.color + '">’ + s.label + ‘</span><span class="bdg" style="background:' + c.color + '22;color:' + c.color + '">’ + esc(c.label) + ‘</span>’ + tags + ‘</div>’;
if (exp) {
html += ‘<div class="tact"><button class="eb" onclick="event.stopPropagation();(function(){var task=S.tasks.find(function(x){return x.id===\'' + t.id + '\';});showTaskModal(task);})()">Edit</button><button class="db" onclick="event.stopPropagation();delTask(\'' + t.id + '\')">Delete</button></div>’;
}
html += ‘</div></div>’;
return html;
}

function renderLog() {
var grouped = {};
S.worklog.forEach(function(e) {
if (!grouped[e.date]) grouped[e.date] = [];
grouped[e.date].push(e);
});
var days = Object.keys(grouped).sort(function(a, b) { return b.localeCompare(a); });
var cnt = {bau:0, project:0, investigation:0, agentic:0};
S.worklog.forEach(function(e) { if (cnt[e.type] !== undefined) cnt[e.type]++; });
var abar = ‘<div class="abar">’ + [[‘project’,’#A78BFA’,‘Project’],[‘bau’,’#94A3B8’,‘BAU’],[‘investigation’,’#F87171’,‘Invest.’],[‘agentic’,’#34D399’,‘Agentic’]].map(function(x) {
return ‘<div class="ap" style="background:' + x[1] + '18"><div style="font-size:18px;font-weight:700;color:' + x[1] + '">’ + cnt[x[0]] + ‘</div><div style="font-size:9px;color:' + x[1] + '">’ + x[2] + ‘</div></div>’;
}).join(’’) + ‘</div>’;
var dh = days.map(function(date) {
var es = grouped[date];
var eh = es.map(function(e) {
var c = getC(e.category), tc = TC[e.type] || ‘#94A3B8’, tl = TL[e.type] || e.type;
return ‘<div class="lc2"><div class="la" style="background:' + c.color + '"></div><div style="flex:1;min-width:0"><div class="ltx">’ + esc(e.text) + ‘</div><div style="display:flex;gap:5px;flex-wrap:wrap"><span class="bdg" style="background:' + c.color + '22;color:' + c.color + '">’ + esc(c.label) + ‘</span><span class="bdg" style="background:' + tc + '22;color:' + tc + '">’ + tl + ‘</span></div></div><button class="ldel" onclick="delLog(\'' + e.id + '\')">x</button></div>’;
}).join(’’);
return ‘<div style="margin-bottom:16px"><div class="dh"><span class="dlb">’ + fdate(date) + ‘</span><span class="ddt">’ + date + ‘</span><span class="dc">’ + es.length + ‘</span></div>’ + eh + ‘</div>’;
}).join(’’);
return ‘<div class="pg"><div class="lh"><span style="font-size:20px">Log</span><span class="lt">Worklog</span><span class="lc">’ + S.worklog.length + ’ entries</span></div>’ + abar + (days.length ? dh : ‘<div style="text-align:center;padding:40px 0;color:#374151">No entries - tap + to log</div>’) + ‘<div style="height:20px"></div></div>’;
}

function renderRep() {
var wk = weekRange();
var rbody = S.report ? ‘<div class="racts"><button class="rab" onclick="copyRep()">’ + (S.copied ? ‘Copied!’ : ‘Copy Email’) + ‘</button><button class="rab" onclick="dlRep()">Download</button></div><div class="rbox"><pre class="rpre">’ + esc(S.report) + ‘</pre></div>’ : ‘<div style="text-align:center;padding:32px 0;color:#374151;font-size:13px">’ + (S.apiKey ? ‘Tap Generate to build your weekly report’ : ‘Add API key first (Key button top right)’) + ‘</div>’;
return ‘<div class="pg"><div class="lh"><span style="font-size:20px">Report</span><span class="lt">Weekly Report</span></div><div class="rh"><div class="rw">’ + wk.label + ’</div><div class="rs">AI reads your worklog and tasks to draft your email</div><button class=“gbtn” onclick=“buildReport()” ’ + (S.repLoading ? ‘disabled’ : ‘’) + ‘>’ + (S.repLoading ? ‘<span style="animation:spin 1s linear infinite;display:inline-block">…</span> Generating…’ : ‘Generate Weekly Report’) + ‘</button></div>’ + rbody + ‘<div style="height:20px"></div></div>’;
}

window.onload = function() {
try {
var lt = localStorage.getItem(‘sb_t’);
var lw = localStorage.getItem(‘sb_w’);
var lc = localStorage.getItem(‘sb_c’);
var lk = localStorage.getItem(‘sb_k’);
S.tasks = lt ? JSON.parse(lt) : null;
S.worklog = lw ? JSON.parse(lw) : null;
S.cats = lc ? JSON.parse(lc) : null;
S.apiKey = lk || ‘’;
} catch(e) {}
if (!S.tasks || !S.tasks.length) S.tasks = ITASKS;
if (!S.worklog || !S.worklog.length) S.worklog = IWL;
if (!S.cats || !S.cats.length) S.cats = CATS;
if (S.apiKey) {
setSyncDot(’#FBBF24’, ‘Syncing with Drive…’);
} else {
setSyncDot(’#F87171’, ‘Local data - tap Key to sync Drive’);
}
render();
if (S.apiKey) syncDrive();
};

</script>
</body>
</html>
