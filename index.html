function uid()    { return Math.random().toString(36).slice(2)+Date.now().toString(36); }
function nowISO() { return new Date().toISOString(); }
function todayStr(){ return new Date().toISOString().slice(0,10); }

function fdate(iso){
  if(!iso) return '';
  var today=new Date(); today.setHours(0,0,0,0);
  var dt=new Date(iso); dt.setHours(0,0,0,0);
  var diff=Math.round((dt-today)/86400000);
  if(diff===0) return 'Today';
  if(diff===1) return 'Tomorrow';
  if(diff<0) return Math.abs(diff)+'d ago';
  return new Date(iso).toLocaleDateString('en-US',{month:'short',day:'numeric'});
}

function isOverdue(t){

function weekRange(){
  var d=new Date(),day=d.getDay();
  var mon=new Date(d); mon.setDate(d.getDate()-((day+6)%7));
  var sun=new Date(mon); sun.setDate(mon.getDate()+6);
  function fmt(x){ return x.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}); }
  return {start:mon.toISOString().slice(0,10),end:sun.toISOString().slice(0,10),label:fmt(mon)+' - '+fmt(sun)};
}

async function callAI(sys,usr,mx,useMCP){
  var body={model:MODEL,max_tokens:mx||1000,system:sys,messages:[{role:'user',content:usr}]};
  if(useMCP) body.mcp_servers=[{type:'url',url:DMCP,name:'gdrive'}];
  var r=await fetch('https://api.anthropic.com/v1/messages',{
    method:'POST',
    headers:{'Content-Type':'application/json','x-api-key':apiKey,'anthropic-version':'2023-06-01','anthropic-beta':'mcp-client-2025-04-04'},
    body:JSON.stringify(body)
  });
  return r.json();
}

async function driveRead(fid){
  if(!apiKey) return null;
  try{
    var d=await callAI('You have Google Drive access. Read file ID "'+fid+'". Return ONLY raw JSON.','Read file.',4000,true);
    var bl=d.content||[];
    for(var i=0;i<bl.length;i++){
      if(bl[i].type==='mcp_tool_result'){
        var t=(bl[i].content&&bl[i].content[0]&&bl[i].content[0].text)||'';
        try{return JSON.parse(t);}catch(e){}
      }
    }
  }catch(e){}
  return null;
}

async function driveWrite(fid,obj){
  if(!apiKey) return;
  try{
    obj.lastUpdated=nowISO();
    await callAI('You have Google Drive access. Overwrite file ID "'+fid+'" with exact JSON. Reply: saved','Save:\n'+JSON.stringify(obj,null,2),200,true);
  }catch(e){}
}

function debSave(key,fid,data){
  clearTimeout(saveTimers[key]);
  saveTimers[key]=setTimeout(async function(){
    document.getElementById('stxt').textContent='Saving...';
    await driveWrite(fid,data);
    document.getElementById('stxt').textContent='Saved';
  },1200);
}

function saveTasks(){ lsave(); debSave('t',DRIVE.tasks,{version:1,items:tasks}); }
function saveWL(){    lsave(); debSave('w',DRIVE.worklog,{version:1,entries:worklog}); }

async function syncDrive(){
  document.getElementById('stxt').textContent='Syncing...';
  try{
    var res=await Promise.all([driveRead(DRIVE.tasks),driveRead(DRIVE.worklog),driveRead(DRIVE.categories)]);
    if(res[0]&&res[0].items&&res[0].items.length) tasks=res[0].items;
    if(res[1]&&res[1].entries&&res[1].entries.length) worklog=res[1].entries;
    if(res[2]&&res[2].categories&&res[2].categories.length) cats=res[2].categories;
    lsave();
    document.getElementById('stxt').textContent='Synced';
  }catch(e){
    document.getElementById('stxt').textContent='Sync failed';
  }
  render();
}

}

function cycleStatus(id){
  var ord=['todo','inprogress','done','blocked','someday'];
  tasks=tasks.map(function(t){
    if(t.id!==id) return t;
    return Object.assign({},t,{status:ord[(ord.indexOf(t.status)+1)%ord.length]});
  });

}

async function buildReport(){
if(!apiKey){alert(‘Add API key first’);return;}
repLoading=true;report=’’;render();
var wk=weekRange();
var logs=worklog.filter(function(e){return e.date>=wk.start&&e.date<=wk.end;});
var wt=tasks.filter(function(t){return t.category===‘work’||t.category===‘projects’;});
try{
var p=‘Generate weekly work update email in this exact format:\n\nHi Sir,\n\nPlease find below my weekly work update:\n\n—\n\nAgentic Solutions / Ideas\n\n| Issue | Summary | Next Steps |\n|——|———|————|\n\n—\n\nProjects\n\n| Project | Status | Summary | Next Steps |\n|––––|––––|———|————|\n\n—\n\nTroubleshooting / Investigation\n\n| Issue | Summary | Next Steps |\n|——|———|————|\n\n—\n\nPlease let me know if you would like additional details.\n\nThanks,\nAbhi Kapoor\n\nWEEK: ‘+wk.label+’\n\nWORKLOG:\n’+logs.map(function(e){return’[’+e.date+’][’+e.type+’] ‘+e.text;}).join(’\n’)+’\n\nTASKS:\n’+wt.map(function(t){return’[’+t.category+’][’+t.status+’] ‘+t.title+(t.notes?’ - ‘+t.notes:’’);}).join(’\n’);
var d=await callAI(‘You are a professional email writer. Follow the format exactly. Return ONLY the email text.’,p,2000,false);
report=(d.content||[]).filter(function(b){return b.type===‘text’;}).map(function(b){return b.text;}).join(’’)||‘Error.’;
}catch(e){report=’Error: ’+e.message;}
repLoading=false;render();
}

function copyReport(){
navigator.clipboard.writeText(report).then(function(){
repCopied=true;render();
setTimeout(function(){repCopied=false;render();},2000);
});
}

function dlReport(){
var a=document.createElement(‘a’);

a.download=‘Report-’+todayStr()+’.txt’;
a.click();
}
