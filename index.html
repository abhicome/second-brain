<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<meta name="theme-color" content="#080C14"/>
<title>Second Brain</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  background:#080C14;
  color:#E2E8F0;
  font-family:Arial,sans-serif;
}

#wrap{
  max-width:430px;
  margin:auto;
  min-height:100vh;
}

#hdr{
  padding:14px 16px;
  border-bottom:1px solid #1F2937;
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:#080C14;
  position:sticky;
  top:0;
  z-index:10;
}

#appBody{
  padding:16px;
  padding-bottom:120px;
}

#nav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:#111827;
  display:flex;
  justify-content:space-around;
  padding:10px 0 20px;
  border-top:1px solid #1F2937;
}

#fab{
  position:fixed;
  bottom:90px;
  right:20px;
  width:54px;
  height:54px;
  border-radius:50%;
  border:none;
  background:linear-gradient(135deg,#4F8EF7,#A78BFA);
  color:white;
  font-size:28px;
  cursor:pointer;
  box-shadow:0 4px 16px #4F8EF755;
}

.ntab{
  background:none;
  border:none;
  color:#6B7280;
  cursor:pointer;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:4px;
  font-size:11px;
}

.ntab.on{
  color:#4F8EF7;
}

.sg{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
  margin:18px 0;
}

.sc{
  background:#111827;
  border-radius:14px;
  padding:16px;
  text-align:center;
}

.sv{
  font-size:28px;
  font-weight:700;
}

.sl{
  margin-top:6px;
  font-size:11px;
  color:#6B7280;
}

.cg{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
}

.ct{
  background:#111827;
  border-radius:16px;
  padding:18px;
}

.tc{
  background:#111827;
  border-radius:14px;
  padding:14px;
  margin-bottom:12px;
}

.badge{
  display:inline-block;
  margin-top:8px;
  margin-right:6px;
  background:#1F2937;
  padding:4px 8px;
  border-radius:6px;
  font-size:10px;
}

.syncbtn{
  background:#111827;
  border:none;
  border-radius:10px;
  padding:8px 14px;
  color:#E2E8F0;
  cursor:pointer;
}

pre{
  white-space:pre-wrap;
  font-size:12px;
  line-height:1.6;
}
</style>
</head>

<body>

<div id="wrap">

  <div id="hdr">
    <div style="font-size:18px;font-weight:700;">
      Second Brain
    </div>

    <div style="display:flex;align-items:center;gap:12px;">
      <button class="syncbtn" onclick="syncDrive()">
        Sync
      </button>

      <div id="status" style="font-size:12px;color:#34D399;">
        Ready
      </div>
    </div>
  </div>

  <div id="appBody"></div>

</div>

<div id="nav">
  <button class="ntab on" onclick="setTab('home')">
    <div>🏠</div>
    <div>Home</div>
  </button>

  <button class="ntab" onclick="setTab('work')">
    <div>💼</div>
    <div>Work</div>
  </button>

  <button class="ntab" onclick="setTab('projects')">
    <div>🚀</div>
    <div>Projects</div>
  </button>

  <button class="ntab" onclick="setTab('log')">
    <div>📋</div>
    <div>Log</div>
  </button>

  <button class="ntab" onclick="setTab('report')">
    <div>📊</div>
    <div>Report</div>
  </button>
</div>

<button id="fab">+</button>

<script>

const DB = {
  tasks: 'https://drive.google.com/uc?export=download&id=1OWIXMe5PvrXOZXDVFDxVfylXQ8Kml_IE',
  categories: 'https://drive.google.com/uc?export=download&id=14zFd-GoGYRGdbjr76ySlRNb-pqZrNSyK',
  worklog: 'https://drive.google.com/uc?export=download&id=1w6jQLE48kmnSQ3kXn5TDiafhfYe2y4tQ'
};

let tasks = [];
let worklog = [];
let categories = [];
let tab = 'home';

function setStatus(t,c){
  const s=document.getElementById('status');
  s.innerText=t;
  s.style.color=c||'#34D399';
}

async function loadJson(url){

  const r = await fetch(url);

  if(!r.ok){
    throw new Error('Fetch failed');
  }

  return await r.json();
}

async function syncDrive(){

  try{

    setStatus('Syncing...','#FBBF24');

    const t = await loadJson(DB.tasks);
    const w = await loadJson(DB.worklog);
    const c = await loadJson(DB.categories);

    tasks = t.items || [];
    worklog = w.entries || [];
    categories = c.categories || [];

    localStorage.setItem('sb_tasks',JSON.stringify(tasks));
    localStorage.setItem('sb_worklog',JSON.stringify(worklog));
    localStorage.setItem('sb_categories',JSON.stringify(categories));

    setStatus('Synced','#34D399');

    render();

  }catch(e){

    console.log(e);

    setStatus('Load failed','#F87171');

    alert('Database load failed');

  }
}

function loadLocal(){

  try{

    tasks = JSON.parse(localStorage.getItem('sb_tasks') || '[]');
    worklog = JSON.parse(localStorage.getItem('sb_worklog') || '[]');
    categories = JSON.parse(localStorage.getItem('sb_categories') || '[]');

  }catch(e){

    tasks = [];
    worklog = [];
    categories = [];

  }
}

function setTab(t){

  tab=t;

  const tabs=document.querySelectorAll('.ntab');

  tabs.forEach(x=>x.classList.remove('on'));

  const arr=['home','work','projects','log','report'];

  tabs[arr.indexOf(t)].classList.add('on');

  render();
}

function render(){

  const b=document.getElementById('appBody');

  if(tab==='home'){
    b.innerHTML=renderHome();
  }

  if(tab==='work'){
    b.innerHTML=renderTasks('work');
  }

  if(tab==='projects'){
    b.innerHTML=renderTasks('projects');
  }

  if(tab==='log'){
    b.innerHTML=renderLog();
  }

  if(tab==='report'){
    b.innerHTML=renderReport();
  }
}

function renderHome(){

  const done=tasks.filter(x=>x.status==='done').length;

  const overdue=tasks.filter(x=>{
    return x.dueDate &&
      x.status!=='done' &&
      new Date(x.dueDate)<new Date();
  }).length;

  return `
    <h1 style="font-size:30px;font-weight:700;margin-bottom:6px;">
      Your Second Brain
    </h1>

    <div style="color:#94A3B8;margin-bottom:20px;">
      ${new Date().toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'})}
    </div>

    <div class="sg">

      <div class="sc">
        <div class="sv" style="color:#4F8EF7;">
          ${tasks.length}
        </div>
        <div class="sl">TOTAL</div>
      </div>

      <div class="sc">
        <div class="sv" style="color:#34D399;">
          ${done}
        </div>
        <div class="sl">DONE</div>
      </div>

      <div class="sc">
        <div class="sv" style="color:#FBBF24;">
          ${worklog.length}
        </div>
        <div class="sl">LOGS</div>
      </div>

      <div class="sc">
        <div class="sv" style="color:#F87171;">
          ${overdue}
        </div>
        <div class="sl">OVERDUE</div>
      </div>

    </div>

    <div style="font-size:13px;color:#6B7280;font-weight:700;margin-bottom:12px;">
      CATEGORIES
    </div>

    <div class="cg">

      <div class="ct">
        <div style="font-size:16px;font-weight:700;">Work</div>
        <div style="margin-top:8px;color:#6B7280;">
          ${tasks.filter(x=>x.category==='work').length} tasks
        </div>
      </div>

      <div class="ct">
        <div style="font-size:16px;font-weight:700;">Projects</div>
        <div style="margin-top:8px;color:#6B7280;">
          ${tasks.filter(x=>x.category==='projects').length} tasks
        </div>
      </div>

      <div class="ct">
        <div style="font-size:16px;font-weight:700;">Worklog</div>
        <div style="margin-top:8px;color:#6B7280;">
          ${worklog.length} entries
        </div>
      </div>

      <div class="ct">
        <div style="font-size:16px;font-weight:700;">Reports</div>
        <div style="margin-top:8px;color:#6B7280;">
          Weekly updates
        </div>
      </div>

    </div>
  `;
}

function renderTasks(cat){

  const list=tasks.filter(x=>x.category===cat);

  let html='';

  html+=`
    <h2 style="font-size:28px;font-weight:700;margin-bottom:18px;">
      ${cat}
    </h2>
  `;

  list.forEach(t=>{

    html+=`
      <div class="tc">

        <div style="font-size:15px;font-weight:700;">
          ${t.title}
        </div>

        <div style="margin-top:8px;color:#94A3B8;font-size:12px;">
          ${t.notes || ''}
        </div>

        <div>

          <span class="badge">
            ${t.priority || 'normal'}
          </span>

          <span class="badge">
            ${t.status || 'todo'}
          </span>

          <span class="badge">
            ${t.dueDate || ''}
          </span>

        </div>

      </div>
    `;
  });

  return html;
}

function renderLog(){

  let html='';

  html+=`
    <h2 style="font-size:28px;font-weight:700;margin-bottom:18px;">
      Worklog
    </h2>
  `;

  worklog.forEach(w=>{

    html+=`
      <div class="tc">

        <div style="font-size:12px;color:#6B7280;margin-bottom:6px;">
          ${w.date || ''}
        </div>

        <div style="font-size:14px;">
          ${w.text || ''}
        </div>

      </div>
    `;
  });

  return html;
}

function renderReport(){

  return `
    <h2 style="font-size:28px;font-weight:700;margin-bottom:20px;">
      Weekly Report
    </h2>

    <div class="tc">

<pre>
Hi Sir,

Please find below my weekly work update:

Generated from:
- Tasks database
- Worklog database
- Projects database

Total Tasks: ${tasks.length}
Total Worklog Entries: ${worklog.length}

Thanks,
Abhi Kapoor
</pre>

    </div>
  `;
}

loadLocal();
render();
syncDrive();

</script>

</body>
</html>
