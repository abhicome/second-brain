// Utils
function uid()     { return Math.random().toString(36).slice(2) + Date.now().toString(36); }
function nowISO()  { return new Date().toISOString(); }
function todayStr(){ return new Date().toISOString().slice(0,10); }

function fdate(iso) {
  if (!iso) return '';
  var today = new Date(); today.setHours(0,0,0,0);
  var dt = new Date(iso); dt.setHours(0,0,0,0);
  var d = Math.round((dt-today)/86400000);
  if (d===0) return 'Today'; if (d===1) return 'Tomorrow'; if (d===-1) return 'Yesterday';
  if (d<0) return Math.abs(d)+'d ago';
  if (d<8) return new Date(iso).toLocaleDateString('en-US',{weekday:'short'});
  return new Date(iso).toLocaleDateString('en-US',{month:'short',day:'numeric'});
}

function isOv(t) { return t.dueDate && t.status!=='done' && new Date(t.dueDate) < new Date(new Date().toDateString()); }

function weekRange() {
  var d = new Date(), day = d.getDay();
  var mon = new Date(d); mon.setDate(d.getDate()-((day+6)%7));
  var sun = new Date(mon); sun.setDate(mon.getDate()+6);
  function fmt(x) { return x.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}); }
  return {start:mon.toISOString().slice(0,10), end:sun.toISOString().slice(0,10), label:fmt(mon)+' - '+fmt(sun)};
}

// Drive
async function callAI(sys,usr,mx,useMCP) {
  var body={model:MODEL,max_tokens:mx||1000,system:sys,messages:[{role:'user',content:usr}]};
  if(useMCP) body.mcp_servers=[{type:'url',url:DMCP,name:'gdrive'}];
  var r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json','x-api-key':apiKey,'anthropic-version':'2023-06-01','anthropic-beta':'mcp-client-2025-04-04'},body:JSON.stringify(body)});
  return r.json();
}
async function driveRead(fid) {
  if(!apiKey) return null;
  try {
    var d=await callAI('You have Google Drive access. Read file ID "'+fid+'". Return ONLY raw JSON.','Read file.',4000,true);
    var bl=d.content||[];
    for(var i=0;i<bl.length;i++){if(bl[i].type==='mcp_tool_result'){var t=(bl[i].content&&bl[i].content[0]&&bl[i].content[0].text)||'';try{return JSON.parse(t);}catch(e){}}}
    for(var j=0;j<bl.length;j++){if(bl[j].type==='text'){var m=bl[j].text.match(/\{[\s\S]*\}/);if(m){try{return JSON.parse(m[0]);}catch(e){}}}}
  } catch(e) {}
  return null;
}
async function driveWrite(fid,obj) {
  if(!apiKey) return;
  try{obj.lastUpdated=nowISO();await callAI('You have Google Drive access. Overwrite file ID "'+fid+'" with exact JSON. Reply: saved','Save:\n'+JSON.stringify(obj,null,2),200,true);}catch(e){}
}
function debSave(key,fid,data) {
  clearTimeout(saveTimers[key]);
  saveTimers[key]=setTimeout(async function(){setSyncDot('#FBBF24','Saving...');await driveWrite(fid,data);setSyncDot('#34D399','Saved');},1200);
}
function saveTasks() { lsave(); debSave('t',DRIVE_IDS.tasks,{version:1,items:tasks}); }
function saveWL()    { lsave(); debSave('w',DRIVE_IDS.worklog,{version:1,entries:worklog}); }
async function syncDrive() {

async function buildReport() {
if(!apiKey){alert(‘Add API key first’);return;}
repLoading=true;report=’’;render();
var wk=weekRange();
var logs=worklog.filter(function(e){return e.date>=wk.start&&e.date<=wk.end;});
var wt=tasks.filter(function(t){return t.category===‘work’||t.category===‘projects’;});
try {
var prompt=‘Generate weekly work update email:\n\nHi Sir,\n\nPlease find below my weekly work update:\n\n—\n\nAgentic Solutions / Ideas\n\n| Issue | Summary | Next Steps |\n|——|———|————|\n[rows]\n\n—\n\nProjects\n\n| Project | Status | Summary | Next Steps |\n|––––|––––|———|————|\n[rows]\n\n—\n\nTroubleshooting / Investigation\n\n| Issue | Summary | Next Steps |\n|——|———|————|\n[rows]\n\n—\n\nPlease let me know if you would like additional details.\n\nThanks,\nAbhi Kapoor\n\nWEEK: ‘+wk.label+’\n\nWORKLOG:\n’+logs.map(function(e){return’[’+e.date+’][’+e.type+’] ‘+e.text;}).join(’\n’)+’\n\nTASKS:\n’+wt.map(function(t){return’[’+t.category+’][’+t.status+’] ‘+t.title+(t.notes?’ - ‘+t.notes:’’);}).join(’\n’);
var d=await callAI(‘You are a professional email writer. Follow the format exactly. Return ONLY the email text.’,prompt,2000,false);
report=(d.content||[]).filter(function(b){return b.type===‘text’;}).map(function(b){return b.text;}).join(’’)||‘Error generating report.’;
} catch(e){report=’Error: ’+e.message;}
repLoading=false;render();
}

function copyReport() {
navigator.clipboard.writeText(report).then(function(){repCopied=true;render();setTimeout(function(){repCopied=false;render();},2000);});
}

a.href=‘data:text/plain;charset=utf-8,’+encodeURIComponent(report);
a.download=‘Report-’+todayStr()+’.txt’;a.click();
}

var rows=cats.map(function(c){var cnt=tasks.filter(function(t){return t.category===c.id;}).length;return’<button onclick="setTab(\''+c.id+'\');closeModal()" style="display:flex;align-items:center;gap:12px;padding:12px;background:#080C14;border:1px solid #1F2937;border-radius:10px;cursor:pointer;width:100%;text-align:left;color:white;margin-bottom:6px;font-family:Sora,sans-serif"><span style="font-size:18px">’+c.icon+’</span><span style="flex:1;font-size:14px;font-weight:500">’+c.label+’</span><span style="color:#4B5563;font-size:12px">’+cnt+’</span></button>’;}).join(’’);
var icons=CAT_ICONS.map(function(ic){return’<button onclick="_newCat.icon=\''+ic+'\';renderCatModal()" style="background:'+(_newCat.icon===ic?'#4F8EF722':'#080C14')+';border:1px solid '+(_newCat.icon===ic?'#4F8EF7':'#374151')+';border-radius:8px;font-size:13px;padding:5px 8px;cursor:pointer;color:white">’+ic+’</button>’;}).join(’’);
document.getElementById(‘mc’).innerHTML=’<div class="ovl" onclick="if(event.target===this)closeModal()"><div class="mdl"><div class="mhdl"></div><div class="mhd"><span class="mttl">All Categories</span><button class="mclb" onclick="closeModal()">X</button></div><div style="margin-bottom:20px">’+rows+’</div><div style="background:#080C14;border:1px solid #1F2937;border-radius:14px;padding:14px"><div class="flbl" style="margin-bottom:8px">New Category</div><div style="display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px">’+icons+’</div><input class="inp" id="ncl" value="'+_newCat.label+'" placeholder="Category name" oninput="_newCat.label=this.value" style="margin-bottom:8px"/><div style="display:flex;align-items:center;gap:10px;margin-bottom:12px"><span class="flbl">Color</span><input type="color" value="'+_newCat.color+'" oninput="_newCat.color=this.value" style="width:36px;height:30px;border:none;border-radius:6px;cursor:pointer;background:transparent"/></div><button class="svbtn" onclick="saveCat()" style="margin-top:0">Create Category</button></div></div></div>’;
}

function saveCat() {
var l=document.getElementById(‘ncl’).value.trim();
if(!l){alert(‘Name required’);return;}
cats.push({id:l.toLowerCase().replace(/\s+/g,’-’)+’-’+Date.now().toString(36),label:l,icon:_newCat.icon,color:_newCat.color});
lsave();if(apiKey)driveWrite(DRIVE_IDS.categories,{version:1,categories:cats});
closeModal();render();
}

function closeModal() { document.getElementById(‘mc’).innerHTML=’’; }

// Init
lload();
setSyncDot(apiKey?’#FBBF24’:’#F87171’, apiKey?‘Syncing…’:‘Tap Key to add API key’);
render();
if(apiKey) syncDrive();

</script>
</body>
</html>
