function renderLog(){var g={};S.worklog.forEach(function(e){if(!g[e.date])g[e.date]=[];g[e.date].push(e)});var days=Object.keys(g).sort(function(a,b){return b.localeCompare(a)});var cnt={bau:0,project:0,investigation:0,agentic:0};S.worklog.forEach(function(e){if(cnt[e.type]!==undefined)cnt[e.type]++});var abar=’<div class="abar">’+[[‘project’,’#A78BFA’,‘Project’],[‘bau’,’#94A3B8’,‘BAU’],[‘investigation’,’#F87171’,‘Invest.’],[‘agentic’,’#34D399’,‘Agentic’]].map(function(x){return’<div class="ap" style="background:'+x[1]+'18"><div style="font-size:18px;font-weight:700;color:'+x[1]+'">’+cnt[x[0]]+’</div><div style="font-size:9px;color:'+x[1]+'">’+x[2]+’</div></div>’}).join(’’)+’</div>’;var dh=days.map(function(date){var es=g[date];var eh=es.map(function(e){var c=getC(e.category),tc=TC[e.type]||’#94A3B8’,tl=TL[e.type]||e.type;return’<div class="lc2"><div class="la" style="background:'+c.color+'"></div><div style="flex:1;min-width:0"><div class="ltx">’+esc(e.text)+’</div><div style="display:flex;gap:5px;flex-wrap:wrap"><span class="bdg" style="background:'+c.color+'22;color:'+c.color+'">’+esc(c.label)+’</span><span class="bdg" style="background:'+tc+'22;color:'+tc+'">’+tl+’</span></div></div><button class="ldel" onclick="delLog(''+e.id+'')">x</button></div>’}).join(’’);return’<div style="margin-bottom:16px"><div class="dh"><span class="dlb">’+fdate(date)+’</span><span class="ddt">’+date+’</span><span class="dc">’+es.length+’</span></div>’+eh+’</div>’}).join(’’);return’<div class="pg"><div class="lh"><span style="font-size:20px">Log</span><span class="lt">Worklog</span><span class="lc">’+S.worklog.length+’ entries</span></div>’+abar+(days.length?dh:’<div style="text-align:center;padding:40px 0;color:#374151">No entries - tap + to log</div>’)+’<div style="height:20px"></div></div>’}
function renderRep(){var wk=weekRange();var rbody=S.report?’<div class="racts"><button class="rab" onclick="copyRep()">’+(S.copied?‘Copied!’:‘Copy Email’)+’</button><button class="rab" onclick="dlRep()">Download</button></div><div class="rbox"><pre class="rpre">’+esc(S.report)+’</pre></div>’:’<div style="text-align:center;padding:32px 0;color:#374151;font-size:13px">’+(S.apiKey?‘Tap Generate to build your weekly report’:‘Add API key first (Key button)’)+’</div>’;return’<div class="pg"><div class="lh"><span style="font-size:20px">Report</span><span class="lt">Weekly Report</span></div><div class="rh"><div class="rw">’+wk.label+’</div><div class="rs">AI reads your worklog and tasks to draft your email</div><button class=“gbtn” onclick=“buildReport()” ‘+(S.repLoading?‘disabled’:’’)+’>’+( S.repLoading?’<span style="animation:spin 1s linear infinite;display:inline-block">O</span> Generating…’:‘Generate Weekly Report’)+’</button></div>’+rbody+’<div style="height:20px"></div></div>’}
window.onload=function(){S.tasks=JSON.parse(localStorage.getItem(‘sb_t’)||‘null’)||ITASKS;S.worklog=JSON.parse(localStorage.getItem(‘sb_w’)||‘null’)||IWL;S.cats=JSON.parse(localStorage.getItem(‘sb_c’)||‘null’)||CATS;S.apiKey=localStorage.getItem(‘sb_k’)||’’;syncDot(S.apiKey?’#FBBF24’:’#F87171’,S.apiKey?‘Syncing…’:‘No API key - tap Key button’);render();if(S.apiKey)syncDrive();else syncDot(’#F87171’,‘Local data - tap Key to sync Drive’)};
</script>
