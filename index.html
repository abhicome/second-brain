<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
<meta name="theme-color" content="#080C14" />
<title>Second Brain</title>

<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet"/>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  -webkit-tap-highlight-color:transparent;
}

body{
  background:#080C14;
  color:#E2E8F0;
  font-family:Sora,sans-serif;
}

#app{
  max-width:430px;
  margin:auto;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  position:relative;
}

#hdr{
  padding:16px;
  border-bottom:1px solid #1F2937;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.brand{
  font-size:20px;
  font-weight:700;
}

#body{
  flex:1;
  overflow:auto;
  padding:16px;
  padding-bottom:100px;
}

.hero{
  margin-bottom:20px;
}

.hero h1{
  font-size:28px;
  margin-bottom:6px;
}

.hero p{
  color:#94A3B8;
  font-size:13px;
}

.sg{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
  margin:20px 0;
}

.sc{
  background:#111827;
  padding:12px;
  border-radius:12px;
  text-align:center;
}

.sv{
  font-size:20px;
  font-weight:700;
}

.sl{
  font-size:10px;
  color:#94A3B8;
  margin-top:4px;
}

.stl{
  display:block;
  margin:20px 0 10px;
  color:#94A3B8;
  font-size:11px;
  text-transform:uppercase;
}

.cg{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
}

.ct{
  background:#111827;
  border:none;
  border-radius:14px;
  padding:16px;
  cursor:pointer;
  color:white;
}

.tc{
  background:#111827;
  border-radius:14px;
  padding:14px;
  margin-bottom:10px;
}

.tt{
  font-size:14px;
  font-weight:600;
}

.tn{
  font-size:12px;
  color:#94A3B8;
  margin-top:6px;
}

.bdg{
  display:inline-block;
  margin-top:8px;
  padding:4px 8px;
  border-radius:6px;
  font-size:10px;
}

#fab{
  position:fixed;
  bottom:90px;
  right:20px;
  width:56px;
  height:56px;
  border-radius:50%;
  border:none;
  background:#4F8EF7;
  color:white;
  font-size:28px;
  cursor:pointer;
}

#nav{
  position:fixed;
  bottom:0;
  width:100%;
  max-width:430px;
  background:#111827;
  display:flex;
  justify-content:space-around;
  padding:12px 0;
  border-top:1px solid #1F2937;
}

.ntab{
  background:none;
  border:none;
  color:#94A3B8;
  cursor:pointer;
  font-size:12px;
}

.ntab.on{
  color:#4F8EF7;
}

.ovl{
  position:fixed;
  inset:0;
  background:#00000090;
  display:flex;
  align-items:flex-end;
}

.mdl{
  background:#111827;
  width:100%;
  max-width:430px;
  margin:auto;
  border-radius:20px 20px 0 0;
  padding:20px;
}

.inp,.sel,.inpta{
  width:100%;
  background:#080C14;
  border:1px solid #374151;
  border-radius:10px;
  padding:12px;
  color:white;
  margin-top:6px;
}

.inpta{
  height:90px;
  resize:none;
}

.svbtn{
  width:100%;
  background:#4F8EF7;
  border:none;
  border-radius:12px;
  padding:14px;
  color:white;
  font-weight:700;
  margin-top:16px;
  cursor:pointer;
}

.fld{
  margin-bottom:14px;
}

.flbl{
  font-size:12px;
  color:#94A3B8;
}

.r2{
  display:flex;
  gap:10px;
}

.r2>div{
  flex:1;
}

.mhd{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
}

.mclb{
  background:none;
  border:none;
  color:white;
  font-size:18px;
  cursor:pointer;
}
</style>
</head>

<body>

<div id="app">

<div id="hdr">
  <div class="brand">Second Brain</div>
  <button onclick="showTaskModal()" style="background:#4F8EF7;border:none;color:white;padding:10px 14px;border-radius:10px;cursor:pointer;">
    Add Task
  </button>
</div>

<div id="body"></div>

<div id="nav">
  <button class="ntab on" onclick="setTab('home')">Home</button>
  <button class="ntab" onclick="setTab('work')">Work</button>
  <button class="ntab" onclick="setTab('projects')">Projects</button>
  <button class="ntab" onclick="setTab('log')">Log</button>
</div>

<button id="fab" onclick="showTaskModal()">+</button>

</div>

<div id="mc"></div>

<script>

const CATS = [
  {id:'work',label:'Work',icon:'💼',color:'#4F8EF7'},
  {id:'projects',label:'Projects',icon:'🚀',color:'#A78BFA'},
  {id:'personal',label:'Personal',icon:'👤',color:'#34D399'}
];

let S = {
  tab:'home',
  expId:null,
  tasks:[
    {
      id:'1',
      title:'DHCP Scope Failover UAT',
      category:'work',
      priority:'urgent',
      status:'inprogress',
      dueDate:'2026-05-09',
      notes:'Discuss feasibility with Vikas Maurya'
    },
    {
      id:'2',
      title:'PacketFence Patching',
      category:'work',
      priority:'high',
      status:'todo',
      dueDate:'2026-05-25',
      notes:'PFE01 patching pending'
    },
    {
      id:'3',
      title:'AD Transformation Roadmap',
      category:'projects',
      priority:'high',
      status:'inprogress',
      dueDate:'2026-05-20',
      notes:'Awaiting Microsoft response'
    }
  ]
};

function saveData(){
  localStorage.setItem('sb_tasks',JSON.stringify(S.tasks));
}

function loadData(){
  const t = localStorage.getItem('sb_tasks');
  if(t){
    S.tasks = JSON.parse(t);
  }
}

function setTab(tab){
  S.tab = tab;

  document.querySelectorAll('.ntab').forEach(x=>{
    x.classList.remove('on');
  });

  if(tab==='home') document.querySelectorAll('.ntab')[0].classList.add('on');
  if(tab==='work') document.querySelectorAll('.ntab')[1].classList.add('on');
  if(tab==='projects') document.querySelectorAll('.ntab')[2].classList.add('on');
  if(tab==='log') document.querySelectorAll('.ntab')[3].classList.add('on');

  render();
}

function render(){

  const body = document.getElementById('body');

  if(S.tab === 'home'){
    renderHome();
    return;
  }

  if(S.tab === 'work'){
    renderList('work');
    return;
  }

  if(S.tab === 'projects'){
    renderList('projects');
    return;
  }

  if(S.tab === 'log'){
    renderLog();
    return;
  }
}

function renderHome(){

  const total = S.tasks.length;
  const done = S.tasks.filter(t=>t.status==='done').length;
  const active = S.tasks.filter(t=>t.status==='inprogress').length;
  const overdue = S.tasks.filter(t=>new Date(t.dueDate)<new Date() && t.status!=='done').length;

  let catHtml = '';

  CATS.forEach(c=>{
    const cnt = S.tasks.filter(t=>t.category===c.id).length;

    catHtml += `
      <button class="ct" onclick="setTab('${c.id}')">
        <div style="font-size:24px">${c.icon}</div>
        <div style="margin-top:8px">${c.label}</div>
        <div style="font-size:12px;color:#94A3B8;margin-top:4px">${cnt} tasks</div>
      </button>
    `;
  });

  document.getElementById('body').innerHTML = `
    <div class="hero">
      <h1>Your Second Brain</h1>
      <p>Track work, projects and ideas</p>
    </div>

    <div class="sg">
      <div class="sc">
        <div class="sv">${total}</div>
        <div class="sl">TOTAL</div>
      </div>

      <div class="sc">
        <div class="sv">${done}</div>
        <div class="sl">DONE</div>
      </div>

      <div class="sc">
        <div class="sv">${active}</div>
        <div class="sl">ACTIVE</div>
      </div>

      <div class="sc">
        <div class="sv">${overdue}</div>
        <div class="sl">OVERDUE</div>
      </div>
    </div>

    <span class="stl">Categories</span>

    <div class="cg">
      ${catHtml}
    </div>
  `;
}

function renderList(cat){

  const list = S.tasks.filter(t=>t.category===cat);

  let html = `
    <h2 style="margin-bottom:20px;text-transform:capitalize">${cat}</h2>
  `;

  if(list.length===0){
    html += `<p style="color:#94A3B8">No tasks found</p>`;
  }

  list.forEach(t=>{

    html += `
      <div class="tc">

        <div class="tt">${t.title}</div>

        <div class="tn">${t.notes || ''}</div>

        <div style="margin-top:10px">
          <span class="bdg" style="background:#1F2937">
            ${t.priority}
          </span>

          <span class="bdg" style="background:#1F2937">
            ${t.status}
          </span>
        </div>

        <div style="display:flex;gap:8px;margin-top:12px">

          <button onclick="toggleDone('${t.id}')" style="flex:1;background:#34D399;border:none;padding:10px;border-radius:8px;cursor:pointer;">
            Done
          </button>

          <button onclick="editTask('${t.id}')" style="flex:1;background:#4F8EF7;border:none;padding:10px;border-radius:8px;cursor:pointer;color:white;">
            Edit
          </button>

          <button onclick="deleteTask('${t.id}')" style="background:#F87171;border:none;padding:10px 14px;border-radius:8px;cursor:pointer;color:white;">
            X
          </button>

        </div>

      </div>
    `;
  });

  document.getElementById('body').innerHTML = html;
}

function renderLog(){

  document.getElementById('body').innerHTML = `
    <h2>Work Log</h2>

    <div class="tc">
      <div class="tt">Weekly tracking enabled</div>
      <div class="tn">Add logs in future version</div>
    </div>
  `;
}

function toggleDone(id){

  S.tasks = S.tasks.map(t=>{

    if(t.id===id){
      t.status = t.status==='done' ? 'todo' : 'done';
    }

    return t;
  });

  saveData();
  render();
}

function deleteTask(id){

  if(!confirm('Delete task?')) return;

  S.tasks = S.tasks.filter(t=>t.id!==id);

  saveData();
  render();
}

function editTask(id){

  const t = S.tasks.find(x=>x.id===id);

  showTaskModal(t);
}

function showTaskModal(task=null){

  const isEdit = !!task;

  const t = task || {
    id:Date.now().toString(),
    title:'',
    notes:'',
    category:'work',
    priority:'normal',
    status:'todo',
    dueDate:''
  };

  document.getElementById('mc').innerHTML = `

    <div class="ovl">

      <div class="mdl">

        <div class="mhd">
          <h2>${isEdit ? 'Edit Task' : 'New Task'}</h2>

          <button class="mclb" onclick="closeModal()">✕</button>
        </div>

        <div class="fld">
          <div class="flbl">Title</div>
          <input class="inp" id="ftitle" value="${t.title}">
        </div>

        <div class="fld">
          <div class="flbl">Notes</div>
          <textarea class="inpta" id="fnotes">${t.notes}</textarea>
        </div>

        <div class="r2">

          <div>
            <div class="flbl">Category</div>

            <select class="sel" id="fcat">
              <option value="work" ${t.category==='work'?'selected':''}>Work</option>
              <option value="projects" ${t.category==='projects'?'selected':''}>Projects</option>
              <option value="personal" ${t.category==='personal'?'selected':''}>Personal</option>
            </select>
          </div>

          <div>
            <div class="flbl">Priority</div>

            <select class="sel" id="fpri">
              <option value="urgent" ${t.priority==='urgent'?'selected':''}>Urgent</option>
              <option value="high" ${t.priority==='high'?'selected':''}>High</option>
              <option value="normal" ${t.priority==='normal'?'selected':''}>Normal</option>
            </select>
          </div>

        </div>

        <div class="fld">
          <div class="flbl">Due Date</div>
          <input type="date" class="inp" id="fdate" value="${t.dueDate}">
        </div>

        <button class="svbtn" onclick="saveTask('${t.id}')">
          ${isEdit ? 'Update Task' : 'Add Task'}
        </button>

      </div>

    </div>
  `;
}

function saveTask(id){

  const title = document.getElementById('ftitle').value.trim();

  if(!title){
    alert('Title required');
    return;
  }

  const obj = {
    id:id,
    title:title,
    notes:document.getElementById('fnotes').value,
    category:document.getElementById('fcat').value,
    priority:document.getElementById('fpri').value,
    status:'todo',
    dueDate:document.getElementById('fdate').value
  };

  const existing = S.tasks.find(t=>t.id===id);

  if(existing){

    S.tasks = S.tasks.map(t=>{
      if(t.id===id){
        obj.status = t.status;
        return obj;
      }
      return t;
    });

  } else {

    S.tasks.unshift(obj);

  }

  saveData();
  closeModal();
  render();
}

function closeModal(){
  document.getElementById('mc').innerHTML = '';
}

loadData();
render();

</script>

</body>
</html>
